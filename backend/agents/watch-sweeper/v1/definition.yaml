# watch-sweeper v1. Draft until chunk 5 wires the runner (WAT-01 to WAT-05, AGT-01,
# AGT-02, AGT-07). The shape is the contract that apps/agents/logic.py reads; keys here
# are kinds (tier 1), everything a tenant configures lives in tenant_agent rows. This
# folder never changes after it ships: a new version is a new folder.
id: watch-sweeper
version: 1
kind: watch            # agent_kind, INPUT_DELTAS section 1
status: draft          # draft | active | retired
description: >
  Checks registered sources for new or changed regulatory documents, registers
  one change per reform with a stable key, and proposes obligation links.
prompt: prompt.md      # the system prompt, this folder
model: claude-opus-5   # the model this version was written and evaluated for; the runner picks the EU endpoint (D-54)
change_note: >
  The first version: sweeps the registered sources, registers one change per reform and
  proposes obligation links and corrections.
scope: platform        # agent_scope: one of bleqq's agents; no bank steers it (D-61, ruling 1)
tenant_configurable: false
writes_to: library     # agent_writes_to: through proposals only, never a direct library write
default_cadence: weekly

# Tools are the agent API operations of docs/inputs/openapi.yaml, in the order a run
# uses them. Scopes are the API key scopes the platform key carries. Nothing else is
# callable: no direct library write, no shell, no browsing outside `fetch`.
tools:
  - name: fetch
    kind: runtime            # provided by the runner, not the app
    purpose: Fetch one URL from a registered source or a link on its page. The body is data, screened before use.
  - name: startAgentRun
    operation: POST /agent-runs
    scopes: [agent-runs:write]
    purpose: Open the run. First call of every execution; returns the run id every later call carries.
    input: AgentRunInput
    output: AgentRun
  - name: listVocabularyRows
    operation: GET /vocab/{list}
    scopes: [library:read]
    purpose: Read each registry list under vocabularies_read_at_run_start, its active rows as key, kind, label and usageNote, before anything else.
    output: VocabularyRowPage
  - name: listTerms
    operation: GET /taxonomy/terms
    scopes: [library:read]
    purpose: Read the taxonomy terms of every dimension at run start, the only term ids a change or a proposal may name.
    output: TaxonomyTermPage
  - name: listAuthorities
    operation: GET /authorities
    scopes: [library:read]
    purpose: Read the issuing authorities at run start, a plain array.
    output: LibraryAuthority
  - name: listSources
    operation: GET /sources
    scopes: [library:read]
    purpose: Read the registered sources at run start, a plain array, the sources a run checks.
    output: WatchSourceOut
  - name: recordSourceCheck
    operation: POST /agent-runs/{runId}/source-checks
    scopes: [sources:write]
    purpose: Log that a source was checked, ok or failed, with items found. One sweep per source per run, also when nothing was found, and one recheck per library record re-checked, naming it.
    input: SourceCheckInput
  - name: getRecordSources
    operation: GET /obligations/{obligationId}/sources
    scopes: [library:read]
    purpose: The re-check. The pages a library obligation cites, per field, for the version in force; compare each with the page as fetched now. Drift becomes a new_obligation_version proposal, never an edit.
    output: LibraryRecordSources
  - name: findSimilar
    operation: POST /search/similar
    scopes: [search:read]
    purpose: Nearest library records to a text. Used before createChange to spot a reform already tracked, and to find candidate obligations for links.
    input: SimilarRequest
    output: SearchResponse
  - name: createChange
    operation: POST /changes
    scopes: [changes:write]
    purpose: Register one change per reform. Idempotent on stableKey; a known key merges new documents as duplicates (AC-WAT1).
    input: ChangeInput
    output: Change
  - name: createProposal
    operation: POST /proposals
    scopes: [proposals:write]
    purpose: The only door into the library. New obligation, new version, re-verification, link suggestions, and new vocabulary terms.
    input: ProposalInput
    output: Proposal
    idempotency: Idempotency-Key header
  - name: finishAgentRun
    operation: PATCH /agent-runs/{runId}
    scopes: [agent-runs:write]
    purpose: Close the run with status and stats, outOfScope among them (documents outside the sector scope, counted on their source's check and never registered or proposed, AGT-08), and recordsRechecked and correctionsProposed for the re-check. Last call, also after a failure.
    input: AgentRunFinish
    output: AgentRun

# Read at run start (key, kind, label, usage note). The agent may submit these keys only; an
# unknown key answers 422 unknown_key with the valid list (AC-WAT2) and is never retried
# with an invented key. A missing value is a proposal.
vocabularies_read_at_run_start:
  - change_type
  - urgency
  - flag
  - term_dimension
  - taxonomy_term        # every dimension, restricts_footprint and descriptive alike
  - authority
  - source
  - instrument_level     # this and the four below: no payload names them yet; read so a vocabulary proposal never repeats a key that exists (AGT-S3)
  - jurisdiction
  - relation_type
  - duty_type
  - provision_kind

# The re-check (WAT-01, AGT-01 item 3). For each source the run checked, the library
# obligations citing a page of it are re-read with getRecordSources and compared with the
# page as fetched now. Each one is logged as a recheck source check naming it. A drifted
# field becomes one new_obligation_version proposal carrying fieldSources per changed field;
# an unchanged record gets its recheck line and no proposal. Counted in the run's stats as
# recordsRechecked and correctionsProposed; the corrections also count as proposals.
recheck:
  subject: obligation
  drift_becomes: new_obligation_version
  unchanged_becomes: nothing

# What the run must emit for every classification (WAT-03, WAT-04).
classification_contract:
  fields: [in_scope, change_type, suggested_urgency, flags, terms, standard_terms, obligation_links, risk_flags]
  confidence: 0.0 to 1.0 on change_type, on each flag and on each obligation link
  status: suggestion until a person confirms it in the app
  # AGT-08. in_scope false sets the document aside: counted as outOfScope, nothing registered
  # or proposed, though the text is still read whole and its change type still named.
  # standard_terms holds the opt-in standard:<key> term, on a standard's own record only and
  # never on a law that cites one.

# Screen for embedded instructions (AGT-07). Applied to every fetched body before any
# other reading of it. A hit marks the document risk_flags ["embedded_instructions"];
# the change is still registered from the factual content, and never acted on.
content_screen:
  patterns_in_evals: backend/agents/watch-sweeper/v1/evals/cases.jsonl
  outcome_flag: embedded_instructions

budget_defaults:
  max_model_calls_per_run: 200
  max_fetches_per_run: 500
  max_changes_per_run: 50
  max_proposals_per_run: 50
  max_rechecks_per_run: 100

evals:
  cases: evals/cases.jsonl
  scored_by: backend/scripts/search_eval.py   # classification track, eval/classification.jsonl: change type, flags, scope, screen, in-scope and standard term
  gate: backend/eval/tolerance.json
