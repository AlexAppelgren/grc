        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/whats-new:
    get:
      operationId: getWhatsNew
      summary: What changed since my last visit
      tags:
      - Identity and access
      x-roles:
      - reader
      description: 'Roles: reader.'
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Defaults to the last visit.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsNew'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/visit:
    post:
      operationId: markVisit
      summary: Record a visit, moves the whats-new bookmark
      tags:
      - Identity and access
      x-roles:
      - reader
      description: 'Roles: reader.'
      responses:
        '204':
          description: Done, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tenant:
    get:
