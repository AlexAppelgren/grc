      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - $ref: '#/components/parameters/provisionId'
      - name: asOf
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Return only the version in force on this date.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProvisionVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /obligations:
    get:
      operationId: listObligations
      summary: List obligations with the tenant's register overlay
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - name: instrumentId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: applicability
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Applicability'
      - name: complianceStatus
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ComplianceStatus'
      - name: termId
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Scope terms, all must match.
      - name: ownerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: inFootprint
        in: query
        required: false
        schema:
          type: boolean
        description: Default true.
      - name: hasOpenChanges
        in: query
        required: false
        schema:
          type: boolean
      - name: reviewDueBefore
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: q
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /obligations/{obligationId}:
    get:
      operationId: getObligation
      summary: Full obligation record
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - $ref: '#/components/parameters/obligationId'
      - name: asOf
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Selects the version in force on this date. Default today.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /obligations/{obligationId}/versions:
    get:
      operationId: listObligationVersions
      summary: All versions
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - $ref: '#/components/parameters/obligationId'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObligationVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /obligations/{obligationId}/diff:
    get:
      operationId: diffObligationVersions
      summary: Show what changed between two versions
      tags:
      - Inventory
      x-roles:
      - reader
      description: 'Defaults to the latest version against the one before it. Roles: reader.'
      parameters:
      - $ref: '#/components/parameters/obligationId'
      - name: from
        in: query
        required: false
        schema:
          type: integer
      - name: to
        in: query
        required: false
        schema:
          type: integer
      - name: lang
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationDiff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /obligations/{obligationId}/changes:
    get:
      operationId: listObligationChanges
      summary: Changes tracked for this obligation
      tags:
      - Inventory
