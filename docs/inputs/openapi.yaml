      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketIntegration'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketIntegration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    termId:
      name: termId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    instrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    provisionId:
      name: provisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    obligationId:
      name: obligationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    linkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    changeId:
      name: changeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    actionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    evidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    proposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    answerId:
      name: answerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    savedSearchId:
      name: savedSearchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    feedId:
      name: feedId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    exportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    importId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    reportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    commentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    webhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    weekStart:
      name: weekStart
      in: path
      required: true
      schema:
        type: string
        format: date
    feedToken:
      name: feedToken
      in: path
      required: true
      schema:
        type: string
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from nextCursor.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Agents retry. The same key returns the first result instead of a second proposal.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role or scope does not allow this
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not visible to this tenant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'State conflict: invalid transition, four-eyes violation, duplicate or precondition not met'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed, see errors
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TenantRole:
      type: string
      enum:
      - admin
      - compliance_officer
      - owner
      - approver
      - contributor
      - reader
      - auditor
    PlatformRole:
      type: string
      enum:
      - platform_admin
      - library_editor
    TermDimension:
      type: string
      enum:
      - regime
      - account_type
      - legal_entity
      - service_type
      - client_category
      - channel
      - lifecycle_stage
    InstrumentLevel:
      type: string
      enum:
      - eu_regulation
      - eu_directive
      - eu_delegated_act
      - eu_guidance
      - swedish_act
      - swedish_ordinance
      - fi_regulation
      - fi_guidance
      - industry_code
    DutyType:
      type: string
      enum:
      - conduct
      - disclosure
      - record_keeping
      - reporting
      - governance
      - technical
    DatePrecision:
      type: string
      enum:
      - day
      - month
      - quarter
      - year
    ChangeType:
      type: string
      enum:
      - consultation
      - proposal
      - adopted
      - in_force
      - guidance
      - supervision
      - enforcement
      - court_ruling
      - recurring_date
    Urgency:
      type: string
      enum:
      - act_now
      - within_3_months
      - six_months_plus
      - monitor
      - no_action
    CaseStatus:
      type: string
      enum:
      - new
      - assigned
      - assessing
      - implementing
      - signoff
      - closed
      - dismissed
      description: new = needs triage. signoff = waiting for a second person.
    Applicability:
      type: string
      enum:
      - applies
      - not_applicable
      - under_assessment
    ComplianceStatus:
      type: string
      enum:
      - compliant
      - partly_compliant
      - gap
      - not_assessed
    RiskRating:
      type: string
      enum:
      - low
      - medium
      - high
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - withdrawn
    ProposalKind:
      type: string
      enum:
      - new_instrument
      - new_provision_version
      - new_obligation
      - new_obligation_version
      - update_obligation
      - retire_obligation
      - reverification
      - link_change_obligation
    ProposalStatus:
      type: string
      enum:
      - open
      - approved
      - rejected
      - superseded
    Origin:
      type: string
      enum:
      - agent
      - user
    SubjectType:
      type: string
      enum:
      - tenant
      - member
      - api_key
      - footprint
      - taxonomy_term
      - instrument
      - provision
      - obligation
      - tenant_obligation
      - applicability_request
      - change
      - change_case
      - assessment
      - action
      - evidence
      - proposal
      - source
      - agent_run
      - briefing
      - webhook
      - export
      - import
      - roadmap
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    Lang:
      type: string
      enum:
      - sv
      - en
    Problem:
      type: object
      description: RFC 9457 problem details. code is machine readable, e.g. four_eyes_violation, open_actions, evidence_missing, invalid_transition.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    UserRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Note:
      type: object
      properties:
        note:
          type: string
    Reason:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
    User:
      type: object
      required:
      - id
      - email
      - name
      - locale
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        locale:
          $ref: '#/components/schemas/Lang'
    TenantSettings:
      type: object
      properties:
        defaultLang:
          $ref: '#/components/schemas/Lang'
        digestWeekday:
          type: integer
        reminderDaysBefore:
          type: array
          items:
            type: integer
        escalateAfterDays:
          type: integer
        escalateToRole:
          $ref: '#/components/schemas/TenantRole'
        retentionYears:
          type: object
          additionalProperties: true
    Tenant:
      type: object
      required:
      - id
      - slug
      - name
      - region
      - settings
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        region:
          type: string
        settings:
          $ref: '#/components/schemas/TenantSettings'
    TenantPatch:
      type: object
      properties:
        name:
          type: string
        settings:
          $ref: '#/components/schemas/TenantSettings'
    Me:
      type: object
      required:
      - user
      - tenant
      - roles
      - platformRoles
      - counts
      - lastVisitAt
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TenantRole'
        platformRoles:
          type: array
          items:
            $ref: '#/components/schemas/PlatformRole'
        counts:
          $ref: '#/components/schemas/QueueCounts'
        lastVisitAt:
          type: string
          format: date-time
          nullable: true
    MePatch:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/Lang'
        notificationPrefs:
          type: object
          additionalProperties: true
    QueueCounts:
      type: object
      required:
      - triage
      - proposals
      - signoffs
      - assignedToMe
      - unreadNotifications
      properties:
        triage:
          type: integer
        proposals:
          type: integer
        signoffs:
          type: integer
        assignedToMe:
          type: integer
        unreadNotifications:
          type: integer
    Member:
      type: object
      required:
      - user
      - roles
      - title
      - lastVisitAt
      properties:
        user:
          $ref: '#/components/schemas/User'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TenantRole'
        title:
          type: string
          nullable: true
        lastVisitAt:
          type: string
          format: date-time
          nullable: true
    MemberInput:
      type: object
      required:
      - email
      - name
      - roles
      properties:
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TenantRole'
        title:
          type: string
    MemberPatch:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TenantRole'
        title:
          type: string
    ApiKey:
      type: object
      required:
      - id
      - name
      - keyPrefix
      - scopes
      - agentId
      - createdAt
      - expiresAt
      - revokedAt
      - lastUsedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        agentId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    ApiKeyInput:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        agentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    ApiKeyCreated:
      type: object
      description: The secret is shown once.
      required:
      - key
      - secret
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
    MyWork:
      type: object
      required:
      - cases
      - actions
      - signoffsWaiting
      - applicabilityRequestsWaiting
      - reviewsDue
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/ChangeListItem'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        signoffsWaiting:
          type: array
          items:
            $ref: '#/components/schemas/ChangeListItem'
        applicabilityRequestsWaiting:
          type: array
          items:
            $ref: '#/components/schemas/ApplicabilityRequest'
        reviewsDue:
          type: array
          items:
            $ref: '#/components/schemas/ObligationSummary'
    Term:
      type: object
      required:
      - id
      - dimension
      - code
      - labelEn
      - labelSv
      - sortOrder
      - active
      properties:
        id:
          type: string
          format: uuid
        dimension:
          $ref: '#/components/schemas/TermDimension'
        code:
          type: string
        labelEn:
          type: string
        labelSv:
          type: string
        sortOrder:
          type: integer
        active:
          type: boolean
    TermInput:
      type: object
      required:
      - dimension
      - code
      - labelEn
      - labelSv
      properties:
        dimension:
          $ref: '#/components/schemas/TermDimension'
        code:
          type: string
        labelEn:
          type: string
        labelSv:
          type: string
        sortOrder:
          type: integer
    TermPatch:
      type: object
      properties:
        labelEn:
          type: string
        labelSv:
          type: string
        sortOrder:
          type: integer
        active:
          type: boolean
    Footprint:
      type: object
      required:
      - terms
      - updatedAt
      properties:
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Term'
        updatedAt:
          type: string
          format: date-time
          nullable: true
    FootprintInput:
      type: object
      description: The full set. Replaces the footprint and recomputes footprintMatch on every case.
      required:
      - termIds
      properties:
        termIds:
          type: array
          items:
            type: string
            format: uuid
    Authority:
      type: object
      required:
      - id
      - code
      - name
      - jurisdiction
      - url
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        jurisdiction:
          type: string
        url:
          type: string
          format: uri
          nullable: true
    Instrument:
      type: object
      required:
      - id
      - stableKey
      - shortName
      - name
      - regime
      - level
      - binding
      - officialRef
      - eliUri
      - sourceUrl
      - authority
      - jurisdiction
      - inForceFrom
      - inForceTo
      - implementsNote
      - obligationCount
      - lastVerifiedAt
      properties:
        id:
          type: string
          format: uuid
        stableKey:
          type: string
        shortName:
          type: string
        name:
          type: string
        regime:
          $ref: '#/components/schemas/Term'
        level:
          $ref: '#/components/schemas/InstrumentLevel'
        binding:
          type: boolean
        officialRef:
          type: string
        eliUri:
          type: string
          format: uri
          nullable: true
        sourceUrl:
          type: string
          format: uri
        authority:
          allOf:
          - $ref: '#/components/schemas/Authority'
          nullable: true
        jurisdiction:
          type: string
        inForceFrom:
          type: string
          format: date
          nullable: true
        inForceTo:
          type: string
          format: date
          nullable: true
        implementsNote:
          type: string
          nullable: true
        obligationCount:
          type: integer
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
    InstrumentRelation:
      type: object
      required:
      - id
      - fromInstrumentId
      - toInstrumentId
      - relation
      - fromRef
      - toRef
      - note
      - otherShortName
      properties:
        id:
          type: string
          format: uuid
        fromInstrumentId:
          type: string
          format: uuid
        toInstrumentId:
          type: string
          format: uuid
        relation:
          type: string
          enum:
          - implements
          - elaborates
          - amends
          - replaces
          - delegated_under
        fromRef:
          type: string
          nullable: true
        toRef:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        otherShortName:
