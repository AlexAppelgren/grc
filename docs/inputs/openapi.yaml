openapi: 3.0.3
info:
  title: Compliance Watch API
  version: 0.1.0
  description: 'Compliance inventory and regulatory watch.


    **Zones.** Library records (instruments, obligations, changes) are sourced public facts shared by all tenants and change only through approved
    proposals. Tenant records (footprint, register, cases) belong to one company.


    **Auth.** People use an OIDC bearer token. The tenant comes from the token, or from `X-Tenant-Id` when a user belongs to several. Agents use
    `X-API-Key` with narrow scopes and can never edit the library directly.


    **Roles.** `x-roles` lists the tenant or platform roles allowed. `reader` means any member. `library_editor` is a platform role.


    **Four eyes.** Applicability decisions, sign-offs and proposals must be approved by someone other than the requester. Violations return 409
    with code `four_eyes_violation`.


    **Audit.** Every write produces an audit event in the same transaction.


    **Conventions.** JSON in camelCase. Cursor pagination with `cursor` and `limit`. Errors follow RFC 9457. Dates are ISO 8601. Partial dates
    carry a precision field.'
servers:
- url: https://api.example.com/v1
  description: Replace with the deployed host
tags:
- name: System
  description: Health.
- name: Identity and access
  description: Users, tenant, members, roles and API keys. Sign-in itself is delegated to an OIDC provider.
- name: Taxonomy and footprint
  description: Scope terms and the company footprint that filters the feed and the inventory.
- name: Inventory
  description: Library zone. Instruments, provisions, obligations and their versions. Read-only here, changed through Proposals.
- name: Register
  description: Tenant zone. Applicability with four-eyes approval, compliance status, risk, owners, internal links.
- name: Watch
  description: Changes found by the agents, their timeline and sources, the source registry and coverage log.
- name: Case workflow
  description: Triage, impact assessment, actions, evidence and sign-off. One case per tenant per change, addressed through the change id.
- name: Proposals
  description: The review queue. Agents and people propose, a second person approves, only then does the library change.
- name: Search and ask
  description: Hybrid search with an as-of date and cited answers.
- name: Home and roadmap
  description: Timeline home, weekly briefing, roadmap, upcoming list and calendar feed.
- name: Reports and exports
  description: Dashboard numbers, committee pack, case file export, spreadsheet import.
- name: Audit and AI governance
  description: Append-only audit log, model output log, problem reports, search evaluation.
- name: Collaboration
  description: Comments, mentions and notifications.
- name: Integration
  description: Webhooks and ticket export.
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency check
      tags:
      - System
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /me:
    get:
      operationId: getMe
      summary: Current user, tenant, roles and queue counts
      tags:
      - Identity and access
      x-roles:
      - reader
      description: 'Roles: reader.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateMe
      summary: Update own locale and notification preferences
      tags:
      - Identity and access
      x-roles:
      - reader
      description: 'Roles: reader.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MePatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me/work:
