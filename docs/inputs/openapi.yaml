            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentRelation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /instruments/{instrumentId}/provisions:
    get:
      operationId: listProvisions
      summary: The provision tree of an instrument
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - $ref: '#/components/parameters/instrumentId'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /provisions/{provisionId}/versions:
