    patch:
      operationId: updateTenant
      summary: Update name, reminders, escalation and retention settings
      tags:
      - Identity and access
      x-roles:
      - admin
      description: 'Roles: admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /tenant/members:
    get:
      operationId: listMembers
      summary: List members
      tags:
      - Identity and access
      x-roles:
      - reader
      description: 'Roles: reader.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
