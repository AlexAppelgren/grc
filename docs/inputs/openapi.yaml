      - $ref: '#/components/parameters/termId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /tenant/footprint:
    get:
      operationId: getFootprint
      summary: The company footprint
      tags:
      - Taxonomy and footprint
      x-roles:
      - reader
      x-api-key-scopes:
      - tenant:read
      description: 'Roles: reader. API key scopes: tenant:read.'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Footprint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: replaceFootprint
      summary: Replace the footprint
      tags:
      - Taxonomy and footprint
      x-roles:
      - admin
      - compliance_officer
      description: 'Recomputes footprintMatch on every case and writes one audit event per term switched. Roles: admin, compliance_officer.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FootprintInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Footprint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /authorities:
    get:
      operationId: listAuthorities
      summary: List authorities
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Authority'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /instruments:
    get:
      operationId: listInstruments
      summary: List instruments
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - name: regimeTermId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: binding
        in: query
        required: false
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Matches name, short name and official reference.
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /instruments/{instrumentId}:
    get:
      operationId: getInstrument
      summary: Get an instrument
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - $ref: '#/components/parameters/instrumentId'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /instruments/{instrumentId}/relations:
    get:
      operationId: listInstrumentRelations
      summary: 'Lineage: what it implements and what elaborates it'
      tags:
      - Inventory
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - $ref: '#/components/parameters/instrumentId'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
