  /tenant/api-keys/{apiKeyId}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags:
      - Identity and access
      x-roles:
      - admin
      description: 'Roles: admin.'
      parameters:
      - $ref: '#/components/parameters/apiKeyId'
      responses:
        '204':
          description: Done, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /taxonomy/terms:
    get:
      operationId: listTerms
      summary: All scope terms, grouped client side by dimension
      tags:
      - Taxonomy and footprint
      x-roles:
      - reader
      x-api-key-scopes:
      - library:read
      description: 'Roles: reader. API key scopes: library:read.'
      parameters:
      - name: dimension
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TermDimension'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTerm
      summary: Add a term
      tags:
      - Taxonomy and footprint
      x-roles:
      - library_editor
      description: 'Roles: library_editor.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
