      summary: Invite a member
      tags:
      - Identity and access
      x-roles:
      - admin
      description: 'Roles: admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /tenant/members/{userId}:
    patch:
      operationId: updateMember
      summary: Change roles or title
      tags:
      - Identity and access
      x-roles:
      - admin
      description: 'Roles: admin.'
      parameters:
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: removeMember
      summary: Remove a member
      tags:
      - Identity and access
      x-roles:
      - admin
      description: 'Refused while the member owns open cases or obligations. Roles: admin.'
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Done, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenant/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      tags:
      - Identity and access
      x-roles:
      - admin
      description: 'Roles: admin.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
