const draftOf=()=>JSON.parse(JSON.stringify(S.footprint));
function scopeDiff(d){const adds=[],removes=[];
 for(const[k,,terms]of SCOPE_GROUPS)for(const t of terms){const was=S.footprint[k].includes(t),now=d[k].includes(t);
  if(now&&!was)adds.push(t);else if(was&&!now)removes.push(t);}
 return{adds,removes};}
function requestTitle(d){const{adds,removes}=scopeDiff(d);
 if(adds.length&&removes.length)return "Add "+adds.join(", ")+", remove "+removes.join(", ");
 if(adds.length)return "Add "+adds.join(", ");
 if(removes.length)return "Remove "+removes.join(", ");
 return "";}
/* A group that holds nothing today and something after the change starts to filter, which
   hides every record tagged only with the rest of the group. That is the dangerous
   direction, so it is said out loud. Emptying a group only widens, and says nothing. */
function narrowedGroups(d){return SCOPE_GROUPS.filter(([k])=>!S.footprint[k].length&&d[k].length).map(([,l])=>l);}
function previewCounts(d){const gone=(a,b)=>a.filter(x=>!b.includes(x)).length;
 const nowC=S.changes.filter(c=>inFoot(c)),nextC=S.changes.filter(c=>inFoot(c,d));
 const nowO=S.obligations.filter(o=>oblInFoot(o)),nextO=S.obligations.filter(o=>oblInFoot(o,d));
 return{hides:{changes:gone(nowC,nextC),obligations:gone(nowO,nextO)},reveals:{changes:gone(nextC,nowC),obligations:gone(nextO,nowO)}};}
function scopeTerms(d,req){const pend=req?scopeDiff(req.draft):{adds:[],removes:[]};
 return `<div class="scope">${SCOPE_GROUPS.map(([k,label,terms])=>{
  const held=d?d[k]:S.footprint[k];
  if(d)return `<fieldset data-dimension="${k}"${held.length?"":` aria-describedby="hint-${k}"`}><legend>${label}</legend>${held.length?"":`<p class="hint" id="hint-${k}">Not restricted: every option applies.</p>`}${terms.map(t=>`<label class="check"><input type="checkbox" data-act-change="scope-tick" data-k="${k}" data-v="${esc(t)}"${held.includes(t)?" checked":""}><span>${esc(t)}</span></label>`).join("")}</fieldset>`;
  const rows=held.length?terms.map(t=>{const on=held.includes(t);
    const mark=pend.adds.includes(t)?'<span class="pill amber">Added when approved</span>':pend.removes.includes(t)?'<span class="pill amber">Removed when approved</span>':"";
    return `<div class="check">${BOX(on)}<span>${esc(t)}<span class="sr">, ${on?"in our scope":"not in our scope"}</span> ${mark}</span></div>`;}).join("")
   :`<p class="meta">Not restricted: every option applies.</p>`;
  return `<div data-dimension="${k}"><h3>${label}</h3>${rows}</div>`;}).join("")}</div>`;}
function scopeCounts(x){return `<p class="meta">${plural(x.obligations,"obligation")}</p><p class="meta">${plural(x.changes,"change")} in the feed</p>`;}
function scopePanel(d){const t=requestTitle(d),c=previewCounts(d),nar=narrowedGroups(d);
 const warn=c.hides.obligations+c.hides.changes>0||nar.length>0;
 return `<div class="panel" data-draft-preview style="margin-top:16px"><h2>${t?"Your change: "+esc(t):"Your change"}</h2>
 ${t?`<div class="pair"><div><h3>Hides</h3>${scopeCounts(c.hides)}</div><div><h3>Reveals</h3>${scopeCounts(c.reveals)}</div></div>
 ${warn?`<div class="notice warn" style="margin:16px 0 0"><p>What this hides leaves the feed, the inventory, the roadmap and the briefing for every member.</p>${nar.map(g=>`<p>${esc(g)} will start to filter: records tagged only with other options in it are hidden from every member.</p>`).join("")}</div>`:""}`
 :`<p>Nothing changed yet.</p>`}
 <div class="bar"><button class="btn outline" data-act="scope-cancel">Cancel</button>${t?`<button class="btn" data-act="scope-send">Request approval</button>`:""}</div></div>`;}
function scopeBanner(req){const c=previewCounts(req.draft),mine=req.by===S.user;
 return `<div class="notice warn" data-pending-request><p><span class="pill amber">Waiting for approval</span> <b>${esc(req.title)}</b></p>
 <p>${mine?"You requested this on "+fmt(req.at)+".":"Requested by "+esc(uname(req.by))+", "+fmt(req.at)+"."} It hides ${plural(c.hides.obligations,"obligation")} and ${plural(c.hides.changes,"change")}, and reveals ${plural(c.reveals.obligations,"obligation")} and ${plural(c.reveals.changes,"change")}.${can("request")?" No other change can be proposed until this one is decided.":""}</p>
 ${mine?`<div class="bar"><button class="btn outline" data-act="scope-withdraw">Withdraw</button></div>`:`<p>Approving and rejecting are not in the prototype. The screen card for /admin/footprint shows them.</p>`}</div>`;}
function vScope(){
 if(!canScope())return `<div class="head"><div><h1>Regulatory scope</h1></div></div>
  <div class="panel"><h2>This page is not available to you</h2><p>It needs footprint request or footprint approve, and your role holds neither. Ask an administrator if you need it. What is in the scope still decides what you see in the feed and the inventory.</p></div>`;
 const req=S.scopeRequest||null,d=S.ui.scopeDraft||null;
 return `<button class="back" data-act="nav" data-v="settings">Back to Settings</button>
 <div class="head"><div><h1>Regulatory scope</h1><p>Which rules apply to us, what we do and for whom</p></div>${can("request")&&!req&&!d?`<button class="btn danger" id="scope-propose" data-act="scope-edit">Propose a change</button>`:""}</div>
 ${req?scopeBanner(req):`<div class="notice">Changes apply to every member once someone else approves them with a passkey.</div>`}
 <div class="panel">${scopeTerms(d,req)}</div>${d?scopePanel(d):""}`;}

function vSettings(){return `<div class="head"><div><h1>Settings</h1><p>People, the legal entities and products behind the inventory, and the prototype's own data.</p></div></div>
 <div class="grid${canScope()?" g2":""}">${canScope()?`<div class="panel"><h2>Regulatory scope</h2><p>Which rules apply to us, what we do and for whom. It decides what every member sees, so a change is a request that someone else approves.</p><div class="bar"><button class="btn outline" data-act="nav" data-v="scope">Open regulatory scope</button></div><p class="meta">Try proposing the removal of Custody: the change counts what it would hide before it is sent, and nothing moves until someone else approves it.</p></div>`:""}
 <div class="panel"><h2>People</h2>${USERS.map(u=>`<p style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span><b>${esc(u.name)}</b><br><span class="meta">${esc(u.role)}</span></span>${u.id===S.user?'<span class="pill green">You</span>':`<button class="btn outline small" data-act="be" data-id="${u.id}">Switch</button>`}</p>`).join("")}<p class="meta">Switch person to try four-eyes approval: whoever requests a sign-off cannot give it.</p></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="panel"><h2>Legal entities and licences</h2><p style="color:var(--muted);font-size:var(--fs-meta)">An obligation that covers more than one of these gets a compliance status per entity.</p>${S.org.entities.map(e=>`<p><b>${esc(e.name)}</b> <span class="pill brass">${esc(e.kind)}</span><br><span class="meta"><span>${esc(e.orgnr)}</span>${e.licences.map(l=>`<span>${esc(l)}</span>`).join("")}</span></p>`).join("")}</div>
 <div class="panel"><h2>Products</h2><p style="color:var(--muted);font-size:var(--fs-meta)">Describe a product the way obligations are scoped, and see which obligations it meets.</p>${S.org.products.map(p=>`<p style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span><b>${esc(p.name)}</b> <span class="pill ${p.status==="Live"?"green":"blue"}">${esc(p.status)}</span><br><span class="meta"><span>${esc(ent(p.entity).name)}</span><span>${esc(p.accounts.join(", "))}</span></span></span><button class="btn outline small" data-act="product-obls" data-id="${p.id}">${productObls(p).length} obligations</button></p>`).join("")}<div class="bar"><button class="btn outline small" data-act="product-new">Add product</button></div></div></div>
 <div class="panel" style="margin-top:14px"><h2>Prototype</h2><p>Reset everything to the starting sample data.</p><button class="btn danger" data-act="reset">Reset prototype</button></div>`;}

 "gap-new":el=>modal(`<h2 style="margin-bottom:12px">Record a gap</h2><div class="field"><label for="g-title">What is missing</label><input id="g-title" placeholder="One sentence"></div><div class="field"><label for="g-desc">Details</label><textarea id="g-desc"></textarea></div><div class="pair"><div class="field"><label for="g-sev">Severity</label><select id="g-sev"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="field"><label for="g-target">Target date</label><input id="g-target" type="date"></div></div><div class="field"><label for="g-owner">Owner</label><select id="g-owner">${USERS.map(u=>`<option value="${u.id}" ${u.id===obl(el.dataset.id).owner?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div><div id="g-err" class="err" role="alert"></div><div class="bar"><button class="btn outline" data-act="modal-close">Cancel</button><button class="btn" data-act="gap-save" data-id="${el.dataset.id}">Record gap</button></div>`),
 "gap-save":el=>{const t=val("g-title");if(!t)return err("g-err","Say what is missing.");if(!val("g-target"))return err("g-err","Set a target date. A gap without a date does not get fixed.");const o=obl(el.dataset.id),g={id:"g"+Date.now(),obl:o.id,title:t,desc:val("g-desc")||t,severity:val("g-sev"),source:"Assessment",owner:val("g-owner"),target:val("g-target"),status:"open",raisedBy:S.user,raisedAt:today(),pendingAccept:null,actions:[]};S.gaps.push(g);log("Recorded gap: "+t,o.title);closeModal();go({name:"gap",id:g.id});toast("Gap recorded");},
 "gap-start":el=>{const g=gapOf(el.dataset.id);g.status="remediating";log("Started remediation",g.title);render();},
 "gap-action-add":el=>{const g=gapOf(el.dataset.id),t=val("ga-title");if(!t)return err("ga-err","Describe the action.");g.actions.push({id:"ga"+Date.now(),title:t,owner:val("ga-owner"),due:val("ga-due"),done:false});if(g.status==="open")g.status="remediating";log("Added action: "+t,g.title);render();},
 "gap-close":el=>{const g=gapOf(el.dataset.id);if(!g.actions.length)return err("g-err","Add at least one action that describes the fix.");if(g.actions.some(a=>!a.done))return err("g-err","Finish every action first.");g.status="closed";g.closedAt=today();g.closedBy=S.user;log("Closed gap",g.title);render();toast("Gap closed. Re-assess the obligation.");},
 "gap-accept":el=>modal(`<h2 style="margin-bottom:12px">Accept the risk</h2><p>The gap stays, and someone else must approve that. Say why it is acceptable and for how long.</p><div class="field"><label for="g-reason">Reason</label><textarea id="g-reason"></textarea></div><div id="g-err2" class="err" role="alert"></div><div class="bar"><button class="btn outline" data-act="modal-close">Cancel</button><button class="btn" data-act="gap-accept-save" data-id="${el.dataset.id}">Send for approval</button></div>`),
 "gap-accept-save":el=>{const r=val("g-reason");if(!r)return err("g-err2","A reason is required.");const g=gapOf(el.dataset.id);g.pendingAccept={by:S.user,reason:r};log("Asked to accept the risk",g.title);closeModal();render();toast("Sent for approval");},
 "gap-accept-approve":el=>{const g=gapOf(el.dataset.id);if(g.pendingAccept.by===S.user)return err("g-err","Four eyes: someone else has to approve this. Switch user to try it.");g.status="accepted";g.acceptReason=g.pendingAccept.reason;g.acceptedReq=g.pendingAccept.by;g.acceptedBy=S.user;g.pendingAccept=null;log("Approved risk acceptance",g.title);render();toast("Risk accepted");},
 "gap-accept-reject":el=>{const g=gapOf(el.dataset.id);if(g.pendingAccept.by===S.user)return err("g-err","Four eyes: someone else has to decide this. Switch user to try it.");g.pendingAccept=null;log("Rejected risk acceptance",g.title);render();},
 "assess-status-save":el=>{const why=val("as-why");if(!why)return err("as-err","Say what the assessment rests on.");const o=obl(el.dataset.id),eid=el.dataset.ent||"",v=el.dataset.v;o.history.unshift({t:today(),by:S.user,method:val("as-method"),status:v,ent:eid,why});if(eid){scopeOf(o,eid).status=v;rollup(o);}else o.status=v;log("Assessed as "+CSTATUS[v][0]+(eid?" for "+ent(eid).name:""),o.title);closeModal();render();toast(["gap","partly"].includes(v)&&!openGaps(o).length?"Saved. Record the gap so it gets an owner and a date.":"Assessment saved");},
 "interp-edit":el=>{const o=obl(el.dataset.id);modal(`<h2 style="margin-bottom:12px">How we read this rule</h2><p>Keep it to what the text leaves open. A second person approves it before it counts.</p><div class="field"><label for="i-text">Interpretation</label><textarea id="i-text" style="min-height:140px">${esc(o.interp?o.interp.text:"")}</textarea></div><div id="i-err2" class="err" role="alert"></div><div class="bar"><button class="btn outline" data-act="modal-close">Cancel</button><button class="btn" data-act="interp-save" data-id="${o.id}">Send for approval</button></div>`);},
 "interp-save":el=>{const t=val("i-text");if(!t)return err("i-err2","Write the interpretation first.");const o=obl(el.dataset.id);o.pendingInterp={by:S.user,text:t};log("Proposed an interpretation",o.title);closeModal();render();toast("Sent for approval");},
 "interp-approve":el=>{const o=obl(el.dataset.id);if(o.pendingInterp.by===S.user)return err("i-err","Four eyes: someone else has to approve this. Switch user to try it.");o.interp={v:(o.interp?o.interp.v:0)+1,text:o.pendingInterp.text,author:o.pendingInterp.by,approvedBy:S.user,at:today()};o.pendingInterp=null;log("Approved interpretation, version "+o.interp.v,o.title);render();toast("Interpretation approved");},
 "interp-reject":el=>{const o=obl(el.dataset.id);if(o.pendingInterp.by===S.user)return err("i-err","Four eyes: someone else has to decide this. Switch user to try it.");o.pendingInterp=null;log("Rejected proposed interpretation",o.title);render();},
 "product-obls":el=>{const p=S.org.products.find(x=>x.id===el.dataset.id),list=productObls(p);modal(`<h2 style="margin-bottom:4px">${esc(p.name)}</h2><p class="meta" style="margin-bottom:12px"><span>${esc(ent(p.entity).name)}</span><span>${esc(p.accounts.join(", "))}</span><span>${esc(p.services.join(", "))}</span></p><p>${list.length} obligations meet this product, matched on legal entity, account type and service.</p><div class="rows">${list.map(o=>`<button class="row" data-act="open-obl" data-id="${o.id}"><div class="meta"><span class="pill brass">${esc(inst(o.instrument).short)}</span>${o.applies==="yes"?cpill(o):'<span class="pill amber">Under assessment</span>'}${openGaps(o).length?`<span class="pill red">${openGaps(o).length} open gap${openGaps(o).length===1?"":"s"}</span>`:""}</div><h3 style="margin:6px 0 0;font-size:var(--fs-body)">${esc(o.title)}</h3></button>`).join("")}</div><div class="bar"><button class="btn outline" data-act="modal-close">Close</button></div>`);},
 "product-new":()=>modal(`<h2 style="margin-bottom:12px">Add product</h2><div class="field"><label for="p-name">Name</label><input id="p-name"></div><div class="pair"><div class="field"><label for="p-ent">Legal entity</label><select id="p-ent">${S.org.entities.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select></div><div class="field"><label for="p-status">Status</label><select id="p-status"><option>Planned</option><option>Live</option></select></div></div><fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;font-size:var(--fs-meta)">Account types</legend><div class="picks">${ACCOUNTS.map(a=>`<label><input type="checkbox" name="p-acc" value="${a}">${a}</label>`).join("")}</div></fieldset><fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;font-size:var(--fs-meta)">Services</legend><div class="picks">${SERVICES.map(a=>`<label><input type="checkbox" name="p-svc" value="${a}">${a}</label>`).join("")}</div></fieldset><div id="p-err" class="err" role="alert"></div><div class="bar"><button class="btn outline" data-act="modal-close">Cancel</button><button class="btn" data-act="product-save">Add product</button></div>`),
 "product-save":()=>{const n=val("p-name"),pick=k=>[...document.querySelectorAll(`input[name="${k}"]:checked`)].map(x=>x.value),acc=pick("p-acc"),svc=pick("p-svc");if(!n)return err("p-err","Name the product.");if(!acc.length||!svc.length)return err("p-err","Pick at least one account type and one service, otherwise nothing can be matched.");const p={id:"p"+Date.now(),name:n,entity:val("p-ent"),accounts:acc,services:svc,status:val("p-status"),owner:S.user};S.org.products.push(p);log("Added product: "+n,"Settings");closeModal();render();toast(productObls(p).length+" obligations meet this product");},
 "agent-toggle":el=>{if(!isAdmin())return;const a=S.agents.find(x=>x.id===el.dataset.id);a.on=!a.on;a.paused=false;log("Switched agent "+(a.on?"on":"off"),a.name);render();},
 "agent-pause":el=>{if(!isAdmin())return;const a=S.agents.find(x=>x.id===el.dataset.id);a.paused=!a.paused;log((a.paused?"Paused":"Resumed")+" agent",a.name);render();},
 "agent-run":el=>{if(!isAdmin())return;const a=S.agents.find(x=>x.id===el.dataset.id);if(S.budget.spent>=S.budget.cap)return toast("Monthly cap reached");const r={id:"r"+Date.now(),t:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16),trigger:"Run now",by:S.user,status:"running",mins:0,found:0,props:0,cost:0};a.runs.unshift(r);log("Started a run",a.name);render();toast("Run started");
  setTimeout(()=>{if(r.status!=="running")return;r.status="done";r.mins=1;r.cost=a.id==="a-sowhat"?0.18:1.40;S.budget.spent=Math.round((S.budget.spent+r.cost)*100)/100;S.audit.unshift({t:new Date().toISOString().slice(0,19),u:"agent",a:"Finished run: no new changes, sources checked",o:a.name});save();if(S.view.name==="agents")render();},4000);},
 "agent-stop":el=>{if(!isAdmin())return;const a=S.agents.find(x=>x.id===el.dataset.id),r=a.runs.find(x=>x.status==="running");if(!r)return;r.status="stopped";r.cost=0.20;S.budget.spent=Math.round((S.budget.spent+r.cost)*100)/100;log("Stopped a running agent",a.name);render();},
 "budget-save":()=>{if(!isAdmin())return;const n=+val("b-cap");if(!(n>0))return toast("Enter an amount above zero");S.budget.cap=n;log("Set monthly agent cap to "+money(n),"Agents");render();toast("Cap updated");},
 "source-new":()=>modal(`<h2 style="margin-bottom:12px">Request a source</h2><div class="field"><label for="s-name">Name</label><input id="s-name"></div><div class="field"><label for="s-url">Address</label><input id="s-url" placeholder="example.se/news"></div><div class="field"><label for="s-vis">Who is it for</label><select id="s-vis"><option value="Private to us">Only us. Active at once, findings stay private</option><option value="Suggested for everyone">Everyone. A bleqq editor reviews it for the shared library</option></select></div><div id="s-err" class="err" role="alert"></div><div class="bar"><button class="btn outline" data-act="modal-close">Cancel</button><button class="btn" data-act="source-save">Request source</button></div>`),
 "source-save":()=>{const n=val("s-name"),u=val("s-url");if(!n||!u)return err("s-err","Give the source a name and an address.");const vis=val("s-vis");S.privateSources.push({name:n,url:u,vis,status:vis==="Private to us"?"Active":"Waiting for editor"});log("Requested source: "+n,"Agents");closeModal();render();toast(vis==="Private to us"?"Source added":"Sent to the library editors");}
};
/* ctrl/cmd+b minimises the rail from 1024px. Below that there is no rail, so the
   shortcut stays the browser's. */
document.addEventListener("keydown",e=>{if(e.key==="b"&&(e.ctrlKey||e.metaKey)&&WIDE.matches){e.preventDefault();ACT.mini();}});
WIDE.addEventListener("change",e=>{if(e.matches)closeMore("main");});
new ResizeObserver(([e])=>{const h=e.borderBoxSize[0].blockSize;if(h)document.documentElement.style.setProperty("--tabbar-height",h+"px");}).observe($("tabbar"));
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;if(el.tagName==="INPUT"&&el.type==="checkbox")return;const fn=ACT[el.dataset.act];if(fn)fn(el,e);});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.bind){S.ui[t.dataset.bind]=t.value;render();}
 else if(t.dataset.bindLive){S.ui[t.dataset.bindLive]=t.value;save();renderResults();}
 else if(t.dataset.actChange==="scope-tick"){const a=S.ui.scopeDraft[t.dataset.k],v=t.dataset.v,i=a.indexOf(v);
  if(t.checked){if(i<0)a.push(v);}else if(i>=0)a.splice(i,1);
  render();const b=document.querySelector(`input[data-act-change="scope-tick"][data-k="${t.dataset.k}"][data-v="${v}"]`);if(b)b.focus();}
 else if(t.dataset.act==="action-toggle"){const c=ch(t.dataset.id),a=c.actions.find(x=>x.id===t.dataset.aid);a.done=t.checked;log((a.done?"Completed":"Reopened")+" action: "+a.title,c.title);render();}
 else if(t.dataset.actChange==="cstatus"){const o=obl(t.dataset.id),eid=t.dataset.ent||"",v=t.value;render();modal(`<h2 style="margin-bottom:4px">Record the assessment</h2><p class="meta" style="margin-bottom:12px"><span class="pill ${CSTATUS[v][1]}">${CSTATUS[v][0]}</span>${eid?`<span>${esc(ent(eid).name)}</span>`:""}</p><div class="field"><label for="as-method">How was it assessed</label><select id="as-method"><option>Self-assessment</option><option>Second-line review</option><option>Internal audit</option><option>External audit</option></select></div><div class="field"><label for="as-why">What it rests on</label><textarea id="as-why" placeholder="What was checked, and what was found"></textarea></div><div id="as-err" class="err" role="alert"></div><div class="bar"><button class="btn outline" data-act="modal-close">Cancel</button><button class="btn" data-act="assess-status-save" data-id="${o.id}" data-ent="${eid}" data-v="${v}">Save assessment</button></div>`);}
 else if(t.dataset.act==="gap-action-toggle"){const g=gapOf(t.dataset.id),a=g.actions.find(x=>x.id===t.dataset.aid);a.done=t.checked;log((a.done?"Completed":"Reopened")+" action: "+a.title,g.title);render();}
 else if(t.dataset.actChange==="agent-cadence"){if(!isAdmin())return;const a=S.agents.find(x=>x.id===t.dataset.id);a.cadence=t.value;log("Changed cadence to "+t.value,a.name);render();}
 else if(t.dataset.actChange==="risk"){const o=obl(t.dataset.id);o.risk=t.value;log("Set risk to "+t.value,o.title);render();}
 else if(t.dataset.actChange==="owner"){const o=obl(t.dataset.id);o.owner=t.value;log("Changed owner to "+uname(t.value),o.title);render();toast("Owner changed");}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.ui.q=e.target.value;save();renderResults();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(moreOpen)closeMore("more-btn");else closeModal();}});
render();
</script>
</body>
</html>
