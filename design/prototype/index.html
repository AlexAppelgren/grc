<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bleqq: compliance inventory and watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Foundations: design/system/foundations.md (Alex, 2026-09-19: "big, clumsy and childish";
   take the colours from Green and seb.io, the proportions from shadcn/ui).
   Colours are Green token values (@sebgroup/green-tokens 2023, Apache-2.0) with the brand
   pair from brand.css; the comment after each names the token. SEB Sans Serif is licensed
   to SEB only, so the text face is Hanken Grotesk. */
:root{
  --bg:#ffffff;          /* l1-neutral-01  page */
  --surface:#ffffff;     /* l2-neutral-02  card, input, outline button */
  --rail:#f7f8f7;        /* l2-neutral-01  sidebar */
  --subtle:#f4f5f5;      /* l1-neutral-02  muted fill: banner, code, table head */
  --accent-bg:#eaebeb;   /* l3-neutral-02  current row, pressed toggle, information pill, meter track */
  --hover:rgba(0,0,0,.06);/* state-neutral-05 hover overlay */
  --line:#dfe1e1;        /* border-neutral-02 hairline: cards, dividers */
  --line-control:#dfe1e1;/* border-neutral-02 outline button, toggle */
  --line-input:#777e7c;  /* border-neutral-01 input boundary, 3:1 (WCAG 1.4.11) */
  --text:#0a0b0b;        /* content-neutral-01 */
  --muted:#636967;       /* content-neutral-02 */
  --primary:#0a0b0b;     /* l3-neutral-03  primary button, toast */
  --on-primary:#ffffff;  /* content-neutral-03 */
  --focus:#005fb3;       /* content-notice-01 */
  --accent:#0a3a2a;      /* brand-01 (brand.css): meters, bars, timeline */
  --sand:#f6f3ec;        /* l2-brand-02  AI-drafted callout, legal margin */
  --brass-bg:#ece5d6;    /* l3-brand-02  brand pill */
  --brass-bg-2:#e2d9c5;  /* l3-brand-02-2 search highlight */
  --bronze:#6a5730;      /* content-brand-02 */
  --red:#b92f13;--red-soft:#fdebe8;     /* content-negative-01, l3-negative-02 */
  --amber:#8f530a;--amber-soft:#fce8cf; /* content-warning-01,  l3-warning-02 */
  --green:#026436;--green-soft:#dcefdc; /* content-positive-03, l3-positive-02 */
  --blue:#005fb3;--blue-soft:#e6f3ff;   /* content-notice-01,   l3-notice-02 */
  --grey-soft:#eaebeb;                  /* l3-neutral-02 */
  --line-strong:#777e7c;                /* border-neutral-01: "not assessed" in the status bar */
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;
  /* Type roles (playbook 6.4). Values changed, names kept. */
  --fs-display:24px;--lh-display:32px;
  --fs-title:16px;--lh-title:24px;
  --fs-body:14px;--lh-body:20px;
  --fs-meta:13px;--lh-meta:18px;
  --fs-micro:11px;--lh-micro:16px;
  --r-control:6px;       /* radius-2xs */
  --r-card:8px;          /* radius-xs */
  --r-overlay:12px;      /* radius-s */
  --shadow-float:0px 4px 6px -2px rgba(10,11,10,.08),0px 12px 16px -4px rgba(10,11,10,.03); /* shadow-l-01 + shadow-l-02, the tab bar only */
  /* Tab bar clearance (design/system/navigation.md section 9). The height is measured. */
  --tabbar-height:64px;
  --tabbar-bottom:max(16px,env(safe-area-inset-bottom));
  --tabbar-top:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0b0b;--surface:#191a1a;--rail:#0a0b0b;--subtle:#191a1a;--accent-bg:#313533;--hover:rgba(255,255,255,.12);
  --line:#282a29;--line-control:#454a48;--line-input:#a0a6a4;--text:#f7f8f7;--muted:#abb0ae;
  --primary:#d5d7d7;--on-primary:#0a0b0b;--focus:#66b8ff;--accent:#d9cba9;
  --sand:#251e13;--brass-bg:#33291a;--brass-bg-2:#443826;--bronze:#d9cba9;
  --red:#f08975;--red-soft:#5c170a;--amber:#f5b970;--amber-soft:#5f3707;--green:#8ae58d;--green-soft:#003d26;
  --blue:#66b8ff;--blue-soft:#003666;--grey-soft:#313533;--line-strong:#a0a6a4;
}}
:root[data-theme="dark"]{
  --bg:#0a0b0b;--surface:#191a1a;--rail:#0a0b0b;--subtle:#191a1a;--accent-bg:#313533;--hover:rgba(255,255,255,.12);
  --line:#282a29;--line-control:#454a48;--line-input:#a0a6a4;--text:#f7f8f7;--muted:#abb0ae;
  --primary:#d5d7d7;--on-primary:#0a0b0b;--focus:#66b8ff;--accent:#d9cba9;
  --sand:#251e13;--brass-bg:#33291a;--brass-bg-2:#443826;--bronze:#d9cba9;
  --red:#f08975;--red-soft:#5c170a;--amber:#f5b970;--amber-soft:#5f3707;--green:#8ae58d;--green-soft:#003d26;
  --blue:#66b8ff;--blue-soft:#003666;--grey-soft:#313533;--line-strong:#a0a6a4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:calc(var(--tabbar-top) + 16px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--text);text-underline-offset:3px}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:-.02em}
h2{font-size:var(--fs-title);line-height:var(--lh-title);letter-spacing:-.01em}
h3{font-size:var(--fs-body);line-height:var(--lh-body)}
p{margin:0 0 8px}
b{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hov,.nav button:hover,.who button:hover,.mini-toggle:hover,.mrow:hover,.mclose:hover,.back:hover,.btn.outline:hover,.btn.ghost:hover,.chip:hover,button.row:hover,button.stat:hover,.rcard:hover{background-image:linear-gradient(var(--hover),var(--hover))}

/* The rail: shadcn's Sidebar (16rem there, 15rem here; 3rem collapsed) in seb.io's
   restraint. 32px rows, a 16px icon, a 14px label; the current row a 6px-radius neutral
   tint at medium weight, never a full pill (that shape is the six tones' alone). */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.app.mini{grid-template-columns:48px 1fr}
.side{background:var(--rail);color:var(--text);border-right:1px solid var(--line);padding:16px 8px 8px;position:sticky;top:0;height:100vh;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column}
.side::-webkit-scrollbar{display:none}
.brand{padding:4px 8px 20px}
.logo{display:block;width:100%;height:auto}
.brand .logo{width:68px}
.brand .mark{display:none}
.app.mini .brand{display:flex;justify-content:center;padding:4px 0 20px}.app.mini .brand .logo{display:none}.app.mini .brand .mark{display:block}
.mbrand{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{margin-top:16px}
.nav button,.who button,.mini-toggle{display:flex;align-items:center;gap:8px;width:100%;height:32px;background-color:transparent;border:0;color:var(--text);text-align:left;padding:0 8px;border-radius:var(--r-control);font-size:var(--fs-body);line-height:var(--lh-body)}
.nav button[aria-current="page"]{background-color:var(--accent-bg);font-weight:500}
.side svg,.msheet svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.side .brand svg{fill:currentColor;stroke:none;height:auto}.side .brand .mark{width:20px;height:20px}
.lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .count{margin-left:auto;color:var(--muted);font-size:var(--fs-meta);font-variant-numeric:tabular-nums}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:8px}
.who button{height:auto;padding:6px 8px}
.who b{display:block;font-weight:500}
.who small{display:block;color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta);overflow:hidden;text-overflow:ellipsis}
.mini-toggle{color:var(--muted);font-size:var(--fs-meta)}
.app.mini .side .lbl,.app.mini .nav .count{display:none}
.app.mini .nav button,.app.mini .who button,.app.mini .mini-toggle{justify-content:center;padding:0}
.app.mini .who button{height:32px}

/* Page */
main{padding:24px 32px 64px;max-width:1200px;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin-bottom:20px}
.head p{color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta);margin:4px 0 0;max-width:72ch}
.kicker,.microlabel{color:var(--muted);font-size:var(--fs-micro);line-height:var(--lh-micro);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.back{display:inline-flex;align-items:center;height:32px;background-color:transparent;border:0;border-radius:var(--r-control);color:var(--muted);padding:0 8px;margin:0 0 8px -8px;font-weight:500}
.back:hover{color:var(--text)}
.notice{background:var(--subtle);color:var(--muted);border-radius:var(--r-control);padding:6px 10px;font-size:var(--fs-meta);line-height:var(--lh-meta);margin-bottom:20px}
/* A warn notice carries the one thing that is waiting. Every word in it is text-fg:
   muted and negative text on the warning fill fail AA in dark mode. */
.notice.warn{background:var(--amber-soft);color:var(--text);padding:10px 12px}
.notice.warn p{margin:0}.notice.warn p+p{margin-top:4px}
/* The warning pill carries the same fill as the notice, so inside one it takes the
   surface instead and keeps its shape. */
.notice.warn .pill{background:var(--surface);color:var(--text)}

/* Card: shadcn's Card with a smaller radius (8px), a hairline, no shadow, 16px padding. */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.field input,.field select,.field textarea,.kv select{width:100%;max-width:100%}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.panel,.feature,.answer,.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.panel>h2,.panel>h3{margin-bottom:12px}
.feature{display:flex;flex-direction:column;gap:12px}
.feature>h2{margin:0}
.feature h2.lead{max-width:60ch}
.stat{text-align:left;width:100%;color:var(--text)}
.stat b{display:block;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 10px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}

/* Input: 36px, 6px radius, a 3:1 boundary. */
.filters select,.filters input[type=date],.field input,.field select,.field textarea,.search input,.kv select,.ent select{background:var(--surface);border:1px solid var(--line-input);border-radius:var(--r-control);padding:0 10px;height:36px;font-size:var(--fs-body)}
.field textarea{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.field input::placeholder,.search input::placeholder{color:var(--muted);font-style:italic}

/* Toggle (filters): an outline control that fills when pressed. Square-ish, so
   it never reads as a pill. */
.chip{display:inline-flex;align-items:center;height:32px;background-color:var(--surface);border:1px solid var(--line-control);border-radius:var(--r-control);padding:0 12px;font-weight:500;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background-color:var(--accent-bg);border-color:var(--line-input);color:var(--text)}

.rows{display:grid;gap:8px}
.row{display:block;width:100%;text-align:left;background-color:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 16px;color:var(--text)}
.row h3{margin:6px 0 4px}
.meta{color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta);display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}

/* Pill: the six tones (pills-and-labels.md). Fully rounded, 20px, meta size at 500. */
.pill{display:inline-flex;align-items:center;height:20px;border-radius:999px;padding:0 8px;font-size:var(--fs-meta);line-height:var(--lh-meta);font-weight:500;white-space:nowrap;background:var(--grey-soft);color:var(--text)}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.brass{background:var(--brass-bg);color:var(--bronze)}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line-control);border-radius:var(--r-card)}

/* Button: 36px, 6px radius, 14px medium. Primary, outline, ghost; danger is an outline in
   the negative text colour. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;background-color:var(--primary);color:var(--on-primary);border:1px solid var(--primary);border-radius:var(--r-control);padding:0 16px;font-weight:500;white-space:nowrap}
.btn:not(.outline):not(.ghost):not(.danger):hover{background-color:color-mix(in srgb,var(--primary) 88%,var(--bg))}
.btn.outline{background-color:var(--surface);color:var(--text);border-color:var(--line-control)}
.btn.ghost{background-color:transparent;color:var(--text);border-color:transparent}
.btn.danger{background-color:var(--surface);color:var(--red);border-color:var(--line-control)}
.btn.danger:hover{background-color:var(--red-soft)}
.btn.small{height:32px;padding:0 12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.barwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.barwrap .bar{margin-top:0}

/* The AI-drafted callout: the one place sand appears as a fill besides the legal margin. */
.sowhat{background:var(--sand);border:1px solid var(--brass-bg);border-radius:var(--r-control);padding:10px 12px;margin:12px 0;line-height:22px}
.sowhat .ai{font-size:var(--fs-micro);line-height:var(--lh-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--bronze);font-weight:500;display:block;margin-bottom:2px}
.home{display:grid;grid-template-columns:1fr 1.6fr;gap:16px;align-items:stretch}
.home>.panel>.barwrap{margin-top:auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dates{display:flex;flex-direction:column}
.dates>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dates>div:first-child{padding-top:0}.dates>div:last-child{border-bottom:0}
.dates i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--muted)}
.dates i.red{background:var(--red)}.dates i.amber{background:var(--amber)}.dates i.blue{background:var(--blue)}.dates i.brass{background:var(--bronze)}
.dates b{font-weight:500;font-variant-numeric:tabular-nums}
.dates a{text-decoration:none}.dates a:hover{text-decoration:underline}
.statusbar{display:flex;gap:2px;margin:4px 0 8px}.statusbar i{height:8px;border-radius:2px;display:block}
.legend{display:flex;justify-content:space-between;padding:2px 0}.legend b{font-weight:500;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta);margin-top:16px}
.brief{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.brief:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.brief a{font-weight:600;text-decoration:none}.brief a:hover{text-decoration:underline}
.brief p{color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta);margin:4px 0 8px}
.roster{display:grid;gap:12px;align-items:start;margin-bottom:16px}
.roster .q{display:flex;flex-direction:column;gap:6px;min-width:0}
.roster .qh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--line);font-weight:600}
.roster .qh span{color:var(--muted);font-weight:400;font-size:var(--fs-meta);font-variant-numeric:tabular-nums}
.rcard{text-align:left;background-color:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 10px;display:flex;flex-direction:column;gap:2px;width:100%;color:var(--text)}
.rcard[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.rcard b{font-size:var(--fs-meta);line-height:var(--lh-meta);font-weight:500;font-variant-numeric:tabular-nums}
.rcard span{font-size:var(--fs-meta);line-height:var(--lh-meta);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard small{font-size:var(--fs-micro);line-height:var(--lh-micro);color:var(--muted)}
.rdetail{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
.inline-detail{display:none}
.nib{width:1em;height:1em;vertical-align:-.12em;margin-right:.4em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 12px 20px;color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta)}
.timeline li:before{content:"";position:absolute;left:3px;top:5px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-input);background:var(--surface)}
.timeline li:after{content:"";position:absolute;left:7px;top:15px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child:after{display:none}
.timeline li.done{color:var(--text)}.timeline li.done:before{background:var(--accent);border-color:var(--accent)}
.timeline li.next:before{border-color:var(--bronze);background:var(--bronze)}

/* The legal text block: the brass margin in the mono face is the product's signature. */
.lagrum{display:grid;grid-template-columns:88px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.lagrum .margin{background:var(--sand);color:var(--bronze);padding:16px 8px;text-align:center;border-right:1px solid var(--brass-bg)}
.lagrum .margin b{display:block;font-family:var(--mono);font-size:var(--fs-display);line-height:var(--lh-display);font-weight:400}
.lagrum .margin small{font-size:var(--fs-micro);line-height:var(--lh-micro);display:block;margin-top:6px}
.lagrum .body{padding:16px 20px;line-height:22px;max-width:72ch}
.lagrum ins{background:var(--green-soft);color:var(--green);text-decoration:none;padding:1px 3px;border-radius:3px}
.lagrum del{background:var(--red-soft);color:var(--red);padding:1px 3px;border-radius:3px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.facets{display:flex;gap:4px;flex-wrap:wrap}

.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:500}
.field .hint{color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta)}
.err{color:var(--red);font-size:var(--fs-meta);line-height:var(--lh-meta);margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:16px;height:16px;margin-top:2px;accent-color:var(--primary)}
.check .done{text-decoration:line-through;color:var(--muted)}
/* Regulatory scope. The read state is the same row with a checkbox-shaped glyph in place
   of the control, so a held and an unheld option read alike, nothing is greyed out and
   nothing sits in the tab order. One column on phones, two above, three from 1280px. */
.check svg{width:16px;height:16px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.check svg rect{stroke:var(--line-strong)}
.scope{display:grid;gap:16px 24px;grid-template-columns:repeat(2,minmax(0,1fr))}
.scope>*{min-width:0}
.scope fieldset{border:0;padding:0;margin:0}
.scope h3,.scope legend{font-weight:600;margin:0 0 4px;padding:0}
.scope .hint{color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta);margin:0 0 4px}
@media (width >= 80rem){.scope{grid-template-columns:repeat(3,minmax(0,1fr))}}

.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1 1 0;min-width:0}
mark{background:var(--brass-bg-2);color:inherit;border-radius:3px;padding:0 2px}
.answer{margin-bottom:16px}
.answer ol{margin:8px 0 0;padding-left:20px;font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--muted)}
.bars div{display:grid;grid-template-columns:140px 1fr 28px;gap:8px;align-items:center;margin-bottom:8px;font-size:var(--fs-meta)}
.bars i{display:block;height:8px;border-radius:2px;background:var(--accent)}
.heat{width:100%;border-collapse:collapse;font-size:var(--fs-meta);font-variant-numeric:tabular-nums}
.heat th,.heat td{height:36px;padding:0 8px;text-align:center;border-bottom:1px solid var(--line)}
.heat th{font-weight:500;color:var(--muted)}
.heat th:first-child,.heat td:first-child{text-align:left}
.scroll{overflow-x:auto}
.log div{padding:10px 0;border-bottom:1px solid var(--line)}.log div:last-child{border-bottom:0}.log time{color:var(--muted);font-size:var(--fs-meta);display:block;font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;background:rgba(10,11,11,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .box{background:var(--surface);border-radius:var(--r-overlay);padding:20px;max-width:540px;width:100%;max-height:86vh;overflow:auto;border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(0,0,0,.3)}
.modal pre{white-space:pre-wrap;font-family:var(--sans);font-size:var(--fs-meta);background:var(--subtle);border:1px solid var(--line);border-radius:var(--r-control);padding:12px;max-height:46vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:var(--r-card);z-index:50;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.3)}
.ent{display:grid;grid-template-columns:1fr minmax(150px,auto);gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ent:last-of-type{border-bottom:0}
.ent small{color:var(--muted);display:block;font-size:var(--fs-meta)}
.ent select{width:100%;max-width:100%}
.meter{height:6px;border-radius:3px;background:var(--grey-soft);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--accent)}
.run{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.run:last-child{border-bottom:0}
.run small{color:var(--muted);font-size:var(--fs-meta)}
.hist{padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.agent h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picks{display:flex;flex-wrap:wrap;gap:4px 16px;margin:4px 0 12px}
.picks label{display:inline-flex;gap:6px;align-items:center;min-height:32px}

/* Phone: actions sit on the right, two share a row, primary on the right (playbook 6.8). */
@media (max-width:820px){
  main{padding:12px 16px 40px}
  h1{font-size:20px;line-height:28px}
  .home,.pair,.rdetail{grid-template-columns:1fr}
  .roster{grid-template-columns:1fr!important}.roster .q.none{display:none}
  .below-detail{display:none}.inline-detail{display:block;padding:8px 2px 12px}
  .bar{justify-content:flex-end;flex-wrap:nowrap}
  .bar .btn{order:2;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .bar .btn:not(.outline):not(.ghost):not(.danger){order:3}
  .barwrap{flex-direction:column;align-items:flex-end;gap:8px}.barwrap .bar{align-self:stretch}
  .head>.btn{margin-left:auto}
  .panel>.btn{display:flex;margin-left:auto}
  .g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:10px}
  .lagrum{grid-template-columns:1fr}.lagrum .margin{display:flex;gap:10px;align-items:baseline;text-align:left;padding:8px 16px;border-right:0;border-bottom:1px solid var(--brass-bg)}
  .lagrum .margin small{margin:0}.lagrum .body{padding:16px}
  .scope{grid-template-columns:1fr}
  .bars div{grid-template-columns:110px 1fr 24px}
  .ent{grid-template-columns:1fr}
}
@media (max-width:380px){.bar .btn{padding:0 12px}.bar .btn.small{padding:0 10px}}

/* Below 1024px (every phone, iPads below 13 inches in portrait, narrow windows) the rail
   gives way to a floating tab bar: the four dock destinations, then More, which opens a
   bottom sheet with every other destination and the account (Alex, 2026-09-19;
   design/system/navigation.md). The wordmark stays as a line at the top of the page. */
.tabbar{display:none}
.tabbar ul{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,6rem);list-style:none;margin:0;padding:0}
.tabbar li{display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:0;background-color:transparent;border:0;border-radius:var(--r-control);color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta);text-align:center;hyphens:auto;overflow-wrap:anywhere;transition:color .15s,background-color .15s}
.tabbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* The current tab: the neutral tint over the cell, medium weight, and a 1px outline
   inset by 1px, the part that reaches 3:1. Keyboard focus swaps it for the ring. */
.tabbar button[data-active="true"]{background-color:var(--accent-bg);color:var(--text);font-weight:500}
.tabbar button[data-active="true"]:not(:focus-visible){outline:1px solid var(--line-strong);outline-offset:-1px}
@media (hover:hover){.tabbar button:hover{background-image:linear-gradient(var(--hover),var(--hover))}}
.mhome{display:block;background:none;border:0;padding:0;color:var(--text)}
.mscrim{position:fixed;inset:0;background:rgba(10,11,11,.6);z-index:40}
.msheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:85svh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:var(--r-overlay) var(--r-overlay) 0 0;padding:0 8px max(16px,env(safe-area-inset-bottom))}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px}
.mclose{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;background-color:transparent;border:0;border-radius:var(--r-control);color:var(--text)}
.msheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.msheet .grp{margin-top:16px}
.mrow{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px;background-color:transparent;border:0;border-radius:var(--r-control);color:var(--text);text-align:left}
.mrow[aria-current="page"]{background-color:var(--accent-bg);font-weight:500;outline:1px solid var(--line-strong);outline-offset:-1px}
.macct{border-top:1px solid var(--line);margin-top:16px;padding-top:8px;display:flex;flex-direction:column;gap:2px}
.macct p{margin:0;padding:6px 8px}
.macct b{display:block;font-weight:500}
.macct small{display:block;color:var(--muted);font-size:var(--fs-meta);line-height:var(--lh-meta)}
.locked{overflow:hidden}
@media (width > 592px){.msheet{max-width:560px;margin-inline:auto;border:1px solid var(--line);border-bottom:0}}
@media (width < 64rem){
  :root{--tabbar-top:calc(var(--tabbar-height) + var(--tabbar-bottom))}
  .app,.app.mini{grid-template-columns:1fr;align-content:start}.side{display:none}
  .mbrand{display:flex;align-items:center;height:32px;margin:0 0 16px}.mbrand .logo{width:64px}
  main{padding-bottom:calc(var(--tabbar-top) + 16px)}
  .toast{bottom:calc(var(--tabbar-top) + 8px)}
  .tabbar{display:block;position:fixed;z-index:30;bottom:var(--tabbar-bottom);left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));width:fit-content;margin-inline:auto;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-overlay);box-shadow:var(--shadow-float)}
}
@media (width < 25rem){.tabbar{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right))}}
/* Short viewports: a phone in landscape puts the icon beside the label; below 320px tall
   the bar leaves the fixed layer and scrolls away at the top of the page. */
@media (width < 64rem) and (height < 30rem){
  :root{--tabbar-bottom:max(8px,env(safe-area-inset-bottom))}
  .tabbar{padding:4px}.tabbar ul{grid-auto-columns:minmax(0,8rem)}
  .tabbar button{flex-direction:row;gap:6px;min-height:44px}
}
@media (width < 64rem) and (height < 20rem){
  :root{--tabbar-top:0px}
  .tabbar{position:static;box-shadow:none;margin:8px auto 0}
}
/* The on-screen keyboard: on touch, the bar hides while a text field has focus. */
@media (width < 64rem) and (pointer:coarse){
  body:has(:is(input:not([type=checkbox],[type=radio],[type=button],[type=submit],[type=reset],[type=range],[type=color],[type=file],[type=image]),textarea,[contenteditable]:not([contenteditable=false])):focus) .tabbar{visibility:hidden}
}
@media print{.tabbar{display:none}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

   effective:"2026-10-01",

   sv:"Investeringsanalys från tredje part får tas emot endast om den betalas med institutets egna medel, från ett analyskonto, eller gemensamt med orderutförande enligt de villkor som anges i reglerna. Institutet ska fastställa kriterier för en årlig bedömning av kvaliteten, användbarheten och värdet av den analys som används. Om analysen inte bidrar till bättre investeringsbeslut ska institutet vidta åtgärder."},

function enrich(st){

 set("o-esma",{history:[{t:"2026-08-20",by:"sara",method:"Second-line review",status:"gap",ent:"",why:"Warning can be passed with one tap and the client's choice is not logged."}]});
 set("o-dora",{scopes:[{entity:"e-bank",status:"compliant"},{entity:"e-ins",status:"partly"},{entity:"e-fund",status:"unknown"}]});
 set("o-pog",{scopes:[{entity:"e-bank",status:"partly"},{entity:"e-ins",status:"compliant"},{entity:"e-fund",status:"compliant"}]});
 for(const o of st.obligations){o.history=o.history||[];o.interp=o.interp||null;o.pendingInterp=null;o.scopes=o.scopes||[];}
 return st;}

function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&s.changes&&s.obligations&&s.footprint&&s.footprint.services&&s.ui&&s.ui.rmKind&&s.gaps&&s.agents&&s.org)return s;}}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const me=()=>USERS.find(u=>u.id===S.user);
const uname=id=>id==="agent"?"Research agent":(USERS.find(u=>u.id===id)||{name:"Unassigned"}).name;
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(d){if(!d)return"";const p=d.split("-");if(p.length===2)return MONTHS[+p[1]-1]+" "+p[0];return +p[2]+" "+MONTHS[+p[1]-1]+" "+p[0];}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysTo(d){if(!d||d.length<10)return null;return Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);}
function daysLabel(d){const n=daysTo(d);if(n===null)return"";if(n<0)return Math.abs(n)+" days ago";if(n===0)return"today";return"in "+n+" days";}
function log(a,o){S.audit.unshift({t:new Date().toISOString().slice(0,19),u:S.user,a,o});}
const ch=id=>S.changes.find(c=>c.id===id);
const obl=id=>S.obligations.find(o=>o.id===id);
const inst=id=>S.instruments.find(i=>i.id===id);
/* An empty group in the scope restricts nothing (FP-01): it is the scope of a tenant that
   has not narrowed that dimension, not the scope of a tenant that hid everything in it.
   Both sides take a scope, so the change preview can count against a draft. */
const any=(a,b)=>!b||!b.length||!a||!a.length||a.some(x=>b.includes(x));
const inFoot=(c,f=S.footprint)=>any(c.regimes,f.regimes)&&any(c.accounts,f.accounts)&&any(c.services,f.services);
const oblInFoot=(o,f=S.footprint)=>any(o.accounts,f.accounts)&&any(o.service,f.services)&&any(o.entity,f.entities)&&any(o.client,f.clients)&&any([inst(o.instrument).regime],f.regimes);
const cpill=o=>`<span class="pill ${CSTATUS[o.status][1]}">${CSTATUS[o.status][0]}</span>`;
const pill=u=>`<span class="pill ${UCLASS[u]||""}">${esc(u)}</span>`;
const gapOf=id=>S.gaps.find(g=>g.id===id);
const ent=id=>S.org.entities.find(e=>e.id===id);
const oblEntities=o=>S.org.entities.filter(e=>o.entity.includes(e.kind));

function scopeOf(o,eid){let x=o.scopes.find(y=>y.entity===eid);if(!x){x={entity:eid,status:o.status};o.scopes.push(x);}return x;}
function rollup(o){const es=oblEntities(o);if(es.length<2)return;o.status=es.map(e=>scopeOf(o,e.id).status).sort((a,b)=>RANK[b]-RANK[a])[0];}
const productObls=p=>{const e=ent(p.entity);return S.obligations.filter(o=>o.applies!=="no"&&o.entity.includes(e.kind)&&any(o.accounts,p.accounts)&&any(o.service,p.services));};

const ICON={today:'<path d="M4 11l8-7 8 7v9H4z"/>',week:'<path d="M4 6h16v14H4z"/><path d="M4 10h16"/><path d="M8 14h3"/>',watch:'<circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>',inventory:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8"/>',gaps:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',roadmap:'<path d="M4 6h16v14H4z"/><path d="M4 10h16"/><path d="M8 3v4M16 3v4"/>',reports:'<path d="M5 4h11l3 3v13H5z"/><path d="M9 16v-3M12 16v-6M15 16v-4"/>',agents:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',audit:'<path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>',settings:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',account:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/>',collapse:'<path d="M4 5h16v14H4z"/><path d="M9 5v14"/><path d="M15 10l-2 2 2 2"/>',expand:'<path d="M4 5h16v14H4z"/><path d="M9 5v14"/><path d="M13 10l2 2-2 2"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
/* The collapsed rail shows the open e alone, cut from the wordmark (the favicon's glyph, without its square). */
const MARK=`<svg class="mark" viewBox="1908 -590 640 640" aria-hidden="true"><path d="M${LOGO_SIDE.match(/ d="([^"]+)"/)[1].split(" M")[3]}"/></svg>`;
function counts(){return{triage:S.changes.filter(c=>c.status==="new").length,props:S.proposals.filter(p=>p.status==="open").length};}
function section(){const n=S.view.name;return n==="change"?"watch":n==="obligation"?"inventory":n==="gap"?"gaps":n==="scope"?"settings":n;}
function renderShell(){
 const c=counts(),cur=section(),n=c.triage+c.props,mini=!!S.ui.mini;
 document.querySelector(".app").classList.toggle("mini",mini);
 $("side").innerHTML=`<div class="brand">${LOGO_SIDE}${MARK}<span class="sr">bleqq [blɛkː]</span></div><nav class="nav" aria-label="Main">${NAV.map(([k,l])=>`<button data-act="nav" data-v="${k}"${k==="roadmap"||k==="agents"?' class="grp"':""}${cur===k?' aria-current="page"':""}${mini?` title="${l}"`:""}>${svg(k)}<span class="lbl">${l}</span>${k==="watch"&&n?`<span class="count">${n}</span>`:""}</button>`).join("")}</nav>
 <div class="railfoot"><div class="who"><button data-act="switch"${mini?` title="${esc(me().name)}"`:""}>${svg("account")}<span class="lbl"><b>${esc(me().name)}</b><small>${esc(me().role)}</small></span></button></div><button class="mini-toggle" data-act="mini" aria-expanded="${!mini}"${mini?' title="Expand menu"':""}>${svg(mini?"expand":"collapse")}<span class="lbl">${mini?"Expand menu":"Minimise menu"}</span></button></div>`;
 $("tabbar").innerHTML=`<ul>${DOCK.map(k=>`<li><button data-act="nav" data-v="${k}"${cur===k?' aria-current="page" data-active="true"':""}>${svg(k)}<span>${SHORT[k]||NAV.find(x=>x[0]===k)[1]}</span></button></li>`).join("")}<li><button id="more-btn" data-act="more" aria-haspopup="dialog" aria-expanded="${moreOpen}"${DOCK.includes(cur)?"":' aria-current="true" data-active="true"'}>${svg("more")}<span>More</span></button></li></ul>`;
}
/* Below 1024px: the tab bar holds the four dock destinations, then More. More opens a
   bottom sheet with every other destination, in the rail's groups, and the account.
   A choice, Close, Escape, the scrim or a width of 1024px closes it. */
const DOCK=["today","watch","inventory","search"],SHORT={search:"Search"},WIDE=matchMedia("(width >= 64rem)");
let moreOpen=false;
function openMore(){
 const cur=section();moreOpen=true;
 $("more").innerHTML=`<div class="mscrim" data-act="more-close"></div><div class="msheet" role="dialog" aria-modal="true" aria-labelledby="more-title"><div class="mhead"><h2 id="more-title">More</h2><button class="mclose" data-act="more-close" aria-label="Close">${svg("close")}</button></div><ul>${NAV.filter(([k])=>!DOCK.includes(k)).map(([k,l])=>`<li${k==="roadmap"||k==="agents"?' class="grp"':""}><button class="mrow" data-act="nav" data-v="${k}"${cur===k?' aria-current="page"':""}>${svg(k)}<span>${l}</span></button></li>`).join("")}</ul><div class="macct" role="group" aria-label="Account"><p><b>${esc(me().name)}</b><small>${esc(me().role)}</small></p><button class="mrow" data-act="switch">Switch user</button></div></div>`;
 document.querySelector(".app").inert=true;document.documentElement.classList.add("locked");
 $("more-btn").setAttribute("aria-expanded","true");
 $("more").querySelector(".mclose").focus();
}
function closeMore(focusId){
 if(!moreOpen)return;moreOpen=false;$("more").innerHTML="";
 document.querySelector(".app").inert=false;document.documentElement.classList.remove("locked");
 const b=$("more-btn");if(b)b.setAttribute("aria-expanded","false");
 if(focusId)$(focusId).focus();
}
function render(){renderShell();const v=S.view;const fn={today:vToday,watch:vWatch,change:vChange,inventory:vInventory,obligation:vObligation,search:vSearch,week:vWeek,roadmap:vRoadmap,reports:vReports,audit:vAudit,settings:vSettings,scope:vScope,gaps:vGaps,gap:vGap,agents:vAgents}[v.name]||vToday;
 $("main").innerHTML=`<div class="mbrand"><button class="mhome" data-act="nav" data-v="today">${LOGO_MOB}</button></div><div class="notice">Prototype with sample data, not verified legal content. Your actions stay in this browser.</div>`+fn(v);
 if(v.name==="search")renderResults();save();}

/* ---------- views ---------- */
function changeRow(c){return `<button class="row" data-act="open-change" data-id="${c.id}"><div class="meta"><span class="pill blue">${esc(c.type)}</span>${pill(c.urgency)}${c.flags.map(f=>`<span class="pill brass">${esc(f)}</span>`).join("")}<span>${esc(c.authority)}</span></div><h3>${esc(c.title)}</h3><p style="margin:0 0 8px;color:var(--muted);font-size:var(--fs-meta)"><b style="color:var(--text)">So what?</b> ${esc(c.sowhat.text)}</p><div class="meta"><span>${esc(STATUS_LABEL[c.status])}${c.owner?", "+esc(uname(c.owner)):""}</span>${c.keyDate?`<span>${esc(c.keyLabel)} ${fmt(c.keyDate)}, ${daysLabel(c.keyDate)}</span>`:""}<span>${c.accounts.length===ACCOUNTS.length?"All accounts":esc(c.accounts.join(", "))}</span></div></button>`;}
function upcomingList(){return S.changes.filter(c=>c.keyDate&&c.status!=="dismissed"&&c.status!=="closed"&&daysTo(c.keyDate)>=0).sort((a,b)=>a.keyDate.localeCompare(b.keyDate));}

const URANK={"Act now":0,"Within 3 months":1,"6+ months":2,"Monitor":3,"No action":4};
function weekItems(){return S.changes.filter(c=>c.week&&c.status!=="dismissed"&&inFoot(c)).sort((x,y)=>URANK[x.urgency]-URANK[y.urgency]);}
function leadItem(){const w=weekItems();if(w.length)return w[0];const o=S.changes.filter(c=>!["closed","dismissed"].includes(c.status)&&inFoot(c)).sort((x,y)=>URANK[x.urgency]-URANK[y.urgency]);return o[0]||null;}
function weekLabel(){const d=new Date(today()+"T00:00:00"),day=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-day);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
 const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const wk=Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7);
 const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
 return `Week ${wk}, ${mon.getDate()}${mon.getMonth()!==sun.getMonth()?" "+MN[mon.getMonth()]:""} to ${sun.getDate()} ${MN[sun.getMonth()]} ${sun.getFullYear()}`;}
function longDate(){const d=new Date(today()+"T00:00:00");return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+" "+d.getDate()+" "+["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]+" "+d.getFullYear();}
function dateRows(list){return `<div class="dates">${list.map(c=>`<div><i class="${UCLASS[c.urgency]||""}"></i><span><b class="${UCLASS[c.urgency]||""}">${fmt(c.keyDate)}</b> <span class="meta" style="display:inline">${daysLabel(c.keyDate)}</span><br><a href="#" data-act="open-change" data-id="${c.id}">${esc(c.keyLabel)}: ${esc(c.title)}</a></span></div>`).join("")}</div>`;}
function standing(){const app=S.obligations.filter(o=>o.applies==="yes"&&oblInFoot(o)),col={compliant:"var(--green)",partly:"var(--amber)",gap:"var(--red)",unknown:"var(--line-strong)"};
 const n=k=>app.filter(o=>o.status===k).length;
 return `<p style="color:var(--muted);font-size:var(--fs-meta);margin-bottom:6px">${app.length} obligations apply to us.</p><div class="statusbar">${Object.keys(CSTATUS).map(k=>n(k)?`<i style="flex:${n(k)} 1 0;background:${col[k]}"></i>`:"").join("")}</div>${Object.keys(CSTATUS).map(k=>`<div class="legend"><span>${CSTATUS[k][0]}</span><b>${n(k)}</b></div>`).join("")}`;}
function leadCard(c,full){if(!c)return `<div class="panel"><h2>This week</h2><p style="color:var(--muted)">Nothing new matches our scope this week.</p></div>`;
 const others=weekItems().filter(x=>x.id!==c.id).length,isNew=c.status==="new";
 return `<div class="${full?"feature":"panel"}" style="${full?"":"display:flex;flex-direction:column;gap:12px"}"><div class="meta"><span class="pill brass">${full?"Lead":"This week"}</span>${pill(c.urgency)}<span>${esc(c.authority)}${c.published?", "+fmt(c.published):""}</span></div>
 <h2 class="${full?"lead":""}">${esc(c.title)}</h2>${full?`<p style="max-width:70ch;margin:0">${esc(c.summary)}</p>`:""}
 <div class="sowhat" style="margin:0">${c.sowhat.confirmed?"":'<span class="ai">Drafted by AI, not yet confirmed by a person</span>'}<b>So what?</b> ${esc(c.sowhat.text)}${c.keyDate?` <b>${esc(c.keyLabel)} ${fmt(c.keyDate)}.</b>`:""}</div>
 <div class="barwrap"><div class="bar">${full?`<button class="btn" data-act="open-change" data-id="${c.id}">${isNew?"Triage this change":"Open this change"}</button>`:`<button class="btn" data-act="nav" data-v="week">Read the briefing</button><button class="btn outline" data-act="open-change" data-id="${c.id}">${isNew?"Triage":"Open"}</button>`}</div>${!full&&others?`<span class="meta">${others} more item${others>1?"s":""} this week</span>`:""}</div></div>`;}

function vToday(){
 const tri=S.changes.filter(c=>c.status==="new"&&inFoot(c)),sign=S.changes.filter(c=>c.status==="signoff"),mine=S.changes.filter(c=>c.owner===S.user&&!["closed","dismissed","signoff"].includes(c.status)),props=S.proposals.filter(p=>p.status==="open");
 const up=upcomingList().filter(c=>inFoot(c)),rm=roadmapItems().length,first=tri.slice().sort((x,y)=>(x.keyDate||"9").localeCompare(y.keyDate||"9"))[0];
 const ok=S.sources.filter(x=>x[2]==="ok").length,bad=S.sources.filter(x=>x[2]!=="ok");
 const decide=[tri.length?`${tri.length} change${tri.length>1?"s":""} need${tri.length>1?"":"s"} triage.${first&&first.keyDate?" The most urgent takes effect "+daysLabel(first.keyDate)+".":""}`:"Nothing is waiting for triage.",
  sign.length?`${sign.length} waiting for sign-off.`:"",props.length?`${props.length} agent proposal${props.length>1?"s":""} to review.`:"",mine.length?`${mine.length} assigned to you.`:""].filter(Boolean);
 return `<div class="head"><div><p class="kicker">${longDate()}</p><h1>What is coming, and where we stand</h1></div></div>
 <div class="home" style="margin-bottom:16px">
  <div class="feature"><h2>Coming up</h2>${up.length?dateRows(up.slice(0,3)):'<p style="color:var(--muted)">No dated changes ahead.</p>'}
   <div class="barwrap" style="margin-top:auto"><div class="bar"><button class="btn outline" data-act="nav" data-v="roadmap">Open the roadmap</button></div><span class="meta">${rm} dated item${rm===1?"":"s"} ahead</span></div></div>
  ${leadCard(leadItem(),false)}
 </div>
 <div class="pair"><div class="panel"><h2>Decide now</h2>${decide.map(d=>`<p style="margin-bottom:6px">${esc(d)}</p>`).join("")}<div class="bar"><button class="btn" data-act="watch-tab" data-tab="${tri.length||!props.length?"triage":"proposals"}">Open the queue</button>${sign.length?`<button class="btn outline" data-act="watch-tab" data-tab="progress">Sign-offs</button>`:""}</div></div>
  <div class="panel"><h2>Where we stand</h2>${standing()}<div class="bar"><button class="btn outline small" data-act="nav" data-v="reports">See the gaps</button></div></div></div>
 <div class="foot"><span>Sources: ${ok} of ${S.sources.length} checked${bad.length?". "+esc(bad[0][0])+" failed "+esc(bad[0][1])+".":"."}</span><a href="#" data-act="nav" data-v="reports">See coverage log</a></div>`;
}

function vWeek(){
 const w=weekItems(),lead=w[0]||null,rest=w.slice(1),up=upcomingList().filter(c=>inFoot(c)).slice(0,3);
 return `<button class="back" data-act="nav" data-v="today">Back to home</button>
 <div class="head"><div><p class="kicker">${weekLabel()}</p><h1>This week in brief</h1></div><span class="meta">The same items go out in the weekly email.</span></div>
 ${lead?leadCard(lead,true):'<div class="empty">Nothing new matches our scope this week. Widen the regulatory scope, or check the Watch tab for older items.</div>'}
 <div class="home" style="grid-template-columns:1.7fr 1fr;margin-top:24px"><div><h2 style="margin-bottom:16px">Also this week</h2>${rest.map(c=>`<div class="brief"><a href="#" data-act="open-change" data-id="${c.id}">${esc(c.title)}</a><p><b style="color:var(--text)">So what?</b> ${esc(c.sowhat.text)}</p>${pill(c.urgency)} ${c.flags.map(f=>`<span class="pill brass">${esc(f)}</span>`).join(" ")} <span class="pill">${esc(STATUS_LABEL[c.status])}</span></div>`).join("")||'<p style="color:var(--muted)">Nothing else this week.</p>'}</div>
 <div class="panel" style="align-self:start"><h2>Coming up</h2>${up.length?dateRows(up):'<p style="color:var(--muted)">No dated changes ahead.</p>'}<div class="bar"><button class="btn outline small" data-act="nav" data-v="roadmap">Open the roadmap</button></div></div></div>`;
}

function roadmapItems(){
 const out=[];
 for(const c of S.changes){if(["closed","dismissed"].includes(c.status)||!inFoot(c))continue;
  if(c.keyDate&&daysTo(c.keyDate)>=0)out.push({id:"c-"+c.id,date:c.keyDate,kind:"reg",u:c.urgency,cls:UCLASS[c.urgency]||"",short:c.keyLabel+": "+c.title,title:c.title,what:c.summary,sowhat:c.sowhat.text,status:STATUS_LABEL[c.status],owner:uname(c.owner),source:c.source.label,obls:c.obligations,act:"open-change",ref:c.id,label:"Open change"});
  if(c.assessment&&c.assessment.saved&&c.assessment.deadline&&daysTo(c.assessment.deadline)>=0)out.push({id:"d-"+c.id,date:c.assessment.deadline,kind:"ours",u:"Our deadline",cls:"brass",short:"Internal deadline: "+c.title,title:"Internal deadline: "+c.title,what:"Set in the impact assessment. What must change: "+(c.assessment.change||"nothing recorded")+".",sowhat:c.keyDate?"Leaves "+Math.max(0,daysTo(c.keyDate)-daysTo(c.assessment.deadline))+" days of margin before "+c.keyLabel.toLowerCase()+" "+fmt(c.keyDate)+".":"Our own target for being ready.",status:STATUS_LABEL[c.status],owner:uname(c.owner),source:"Impact assessment",obls:c.obligations,act:"open-change",ref:c.id,label:"Open change"});
  for(const x of c.actions){if(!x.done&&x.due&&daysTo(x.due)>=0)out.push({id:"a-"+x.id,date:x.due,kind:"ours",u:"Our deadline",cls:"brass",short:"Action: "+x.title,title:"Action due: "+x.title,what:"An open action under the change: "+c.title+".",sowhat:"Sign-off on the change stays blocked until every action is done.",status:"Open action",owner:uname(x.owner),source:"Change record, action list",obls:c.obligations,act:"open-change",ref:c.id,label:"Open change"});}}
 for(const o of S.obligations){if(o.applies!=="yes"||o.status==="compliant"||!o.review||daysTo(o.review)<0||!oblInFoot(o))continue;
  out.push({id:"o-"+o.id,date:o.review,kind:"ours",u:"Our deadline",cls:"brass",short:"Review: "+o.title,title:"Review due: "+o.title,what:CSTATUS[o.status][0]+". "+(o.statusNote||"No note recorded."),sowhat:o.status==="unknown"?"Assess it and record the compliance status.":"Decide the fix, or document why the current state is acceptable.",status:CSTATUS[o.status][0],owner:uname(o.owner),source:"Inventory, next review date",obls:[o.id],act:"open-obl",ref:o.id,label:"Open obligation"});}
 for(const g of S.gaps){if(!["open","remediating"].includes(g.status))continue;const o=obl(g.obl);if(!o||!oblInFoot(o))continue;
  if(g.target&&daysTo(g.target)>=0)out.push({id:"g-"+g.id,date:g.target,kind:"ours",u:"Our deadline",cls:"brass",short:"Close gap: "+g.title,title:"Gap to close: "+g.title,what:g.desc,sowhat:"Until it is closed or the risk is formally accepted, "+o.title.toLowerCase()+" stays short of compliant.",status:GSTATUS[g.status][0],owner:uname(g.owner),source:"Gap register",obls:[g.obl],act:"open-gap",ref:g.id,label:"Open gap"});
  for(const x of g.actions){if(!x.done&&x.due&&daysTo(x.due)>=0)out.push({id:"ga-"+x.id,date:x.due,kind:"ours",u:"Our deadline",cls:"brass",short:"Action: "+x.title,title:"Action due: "+x.title,what:"An open action under the gap: "+g.title+".",sowhat:"The gap cannot be closed until every action is done.",status:"Open action",owner:uname(x.owner),source:"Gap register, action list",obls:[g.obl],act:"open-gap",ref:g.id,label:"Open gap"});}}
 return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function qLabel(d){return "Q"+(Math.floor((+d.slice(5,7)-1)/3)+1)+" "+d.slice(0,4);}
function rmDetail(it){return `<div class="meta"><span class="pill ${it.cls}">${esc(it.u)}</span><b style="color:var(--text)">${fmt(it.date)}</b><span>${daysLabel(it.date)}</span><span>${it.kind==="reg"?"Regulatory date":"Our deadline"}</span></div>
 <h2 style="margin:8px 0 12px">${esc(it.title)}</h2>
 <div class="rdetail"><div><p>${esc(it.what)}</p><div class="sowhat" style="margin-bottom:0"><b>So what?</b> ${esc(it.sowhat)}</div></div>
 <dl class="kv" style="grid-template-columns:110px 1fr;align-content:start"><dt>Status</dt><dd><b>${esc(it.status)}</b></dd><dt>Owner</dt><dd><b>${esc(it.owner)}</b></dd><dt>Source</dt><dd>${esc(it.source)}</dd><dt>Obligations</dt><dd>${it.obls.map(id=>{const o=obl(id);return o?`<a href="#" data-act="open-obl" data-id="${o.id}">${esc(o.title)}</a>`:"";}).filter(Boolean).join("<br>")||"None linked yet"}</dd></dl></div>
 <div class="bar"><button class="btn" data-act="${it.act}" data-id="${it.ref}">${it.label}</button><button class="btn outline" data-act="subscribe">Add to calendar</button></div>`;}
function vRoadmap(){
 const ui=S.ui,all=roadmapItems(),shown=all.filter(i=>ui.rmKind==="all"||i.kind===ui.rmKind);
 const sel=shown.find(i=>i.id===ui.rmPick)||shown[0]||null;
 const qs=[];if(all.length){let y=+today().slice(0,4),q=Math.floor((+today().slice(5,7)-1)/3)+1;const last=qLabel(all[all.length-1].date);for(let n=0;n<8;n++){const l="Q"+q+" "+y;qs.push(l);if(l===last)break;q++;if(q>4){q=1;y++;}}}
 const chips=[["all","Everything"],["reg","Regulatory dates"],["ours","Our deadlines"]];
 return `<button class="back" data-act="nav" data-v="today">Back to home</button>
 <div class="head"><div><h1>Roadmap</h1><p>Every dated change and every deadline of our own, by quarter. Select a card to see the details.</p></div><button class="btn outline" data-act="subscribe">Subscribe to calendar feed</button></div>
 <div class="filters">${chips.map(([k,l])=>`<button class="chip" data-act="rm-kind" data-k="${k}" aria-pressed="${ui.rmKind===k}">${l}</button>`).join("")}<span class="meta">${shown.length} item${shown.length===1?"":"s"} shown</span></div>
 ${qs.length?`<div class="roster" style="grid-template-columns:repeat(${Math.max(qs.length,4)},minmax(0,1fr))">${qs.map(l=>{const list=shown.filter(i=>qLabel(i.date)===l);return `<div class="q ${list.length?"":"none"}"><div class="qh">${l}<span>${list.length}</span></div>${list.map(i=>`<div><button class="rcard" data-act="rm-pick" data-id="${i.id}" aria-pressed="${sel&&sel.id===i.id}"><b class="${i.cls}">${fmt(i.date)}</b><span>${esc(i.short)}</span><small>${i.kind==="reg"?"Regulatory date":"Our deadline"}</small></button>${sel&&sel.id===i.id?`<div class="inline-detail">${rmDetail(i)}</div>`:""}</div>`).join("")||'<small style="color:var(--muted);padding:8px 2px">Nothing dated</small>'}</div>`;}).join("")}</div>
 ${sel?`<div class="feature below-detail" style="gap:0">${rmDetail(sel)}</div>`:""}`:'<div class="empty">No dated items ahead. Dates appear here when a change has an effective date, an action has a due date, or an obligation with a gap is due for review.</div>'}`;
}

function vWatch(){
 const ui=S.ui,tabs=[["triage","Needs triage"],["progress","In progress"],["closed","Closed"],["dismissed","Dismissed"],["proposals","Agent proposals"]];
 const inTab=c=>({triage:c.status==="new",progress:["assigned","assessing","implementing","signoff"].includes(c.status),closed:c.status==="closed",dismissed:c.status==="dismissed"}[ui.watchTab]);
 let body;
 if(ui.watchTab==="proposals"){
  const ps=S.proposals;

 }else{
  let list=S.changes.filter(inTab);

  if(ui.fFoot)list=list.filter(c=>inFoot(c));
  body=`<div class="filters"><select data-bind="fRegime" aria-label="Regime"><option value="">All regimes</option>${REGIMES.map(r=>`<option ${ui.fRegime===r?"selected":""}>${r}</option>`).join("")}</select>
  <select data-bind="fUrgency" aria-label="Urgency"><option value="">Any urgency</option>${URGENCY.map(r=>`<option ${ui.fUrgency===r?"selected":""}>${r}</option>`).join("")}</select>
  <button class="chip" data-act="toggle-foot" aria-pressed="${ui.fFoot}">Matches our scope</button></div>
  <div class="rows">${list.map(changeRow).join("")||'<div class="empty">Nothing here. Change the filters or check another tab.</div>'}</div>`;
 }
 const c=counts();
 return `<div class="head"><div><p class="kicker">${weekLabel()}</p><h1>Watch</h1><p>Changes found by the research agents, waiting for a person to decide.</p></div></div>
 <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-act="watch-tab" data-tab="${k}" aria-selected="${ui.watchTab===k}">${l}${k==="triage"&&c.triage?" ("+c.triage+")":""}${k==="proposals"&&c.props?" ("+c.props+")":""}</button>`).join("")}</div>${body}`;
}

function vChange(v){
 const c=ch(v.id);if(!c)return"<p>Not found.</p>";
 const owners=USERS.map(u=>`<option value="${u.id}" ${c.owner===u.id?"selected":""}>${esc(u.name)}</option>`).join("");
 let work="";
 if(c.status==="new"){
  work=`<div class="panel"><h2>Triage</h2><p style="color:var(--muted)">Confirm that this is relevant, set urgency and give it an owner. Or dismiss it with a reason, which is kept for audit.</p>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="t-urg">Urgency</label><select id="t-urg">${URGENCY.map(u=>`<option ${c.urgency===u?"selected":""}>${u}</option>`).join("")}</select></div>
  <div class="field"><label for="t-own">Owner</label><select id="t-own"><option value="">Choose owner</option>${owners}</select></div></div>
  <div class="field"><label for="t-reason">Reason, if you dismiss</label><textarea id="t-reason" placeholder="For example: we do not receive third-party research"></textarea></div>
  <div id="t-err" class="err" role="alert"></div>
  <div class="bar"><button class="btn" data-act="triage-confirm" data-id="${c.id}">Confirm and assign</button><button class="btn danger" data-act="triage-dismiss" data-id="${c.id}">Dismiss</button></div></div>`;
 }else if(c.status==="assigned"){
  work=`<div class="panel"><h2>Next step</h2><p>Assigned to ${esc(uname(c.owner))}. An impact assessment records whether this applies, what must change and by when.</p><div class="bar"><button class="btn" data-act="assess-start" data-id="${c.id}">Start assessment</button><button class="btn outline" data-act="close-noaction" data-id="${c.id}">No action</button></div></div>`;
 }else if(c.status==="assessing"){
  const a=c.assessment;
  work=`<div class="panel"><h2>Impact assessment</h2>
  <div class="field"><label for="a-applies">Does it apply to us?</label><select id="a-applies">${["Yes","Partly","No"].map(x=>`<option ${a.applies===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><label for="a-why">Why</label><textarea id="a-why">${esc(a.why)}</textarea></div>
  <div class="field"><label for="a-change">What must change</label><textarea id="a-change" placeholder="Processes, customer journeys, disclosures, data, systems">${esc(a.change)}</textarea></div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="a-deadline">Internal deadline</label><input type="date" id="a-deadline" value="${esc(a.deadline)}"></div>
  <div class="field"><label for="a-effort">Effort</label><select id="a-effort">${[["S","Small, days"],["M","Medium, weeks"],["L","Large, months"]].map(([k,l])=>`<option value="${k}" ${a.effort===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
  <div class="field"><label for="a-contrib">Contributors</label><input id="a-contrib" value="${esc(a.contributors)}" placeholder="Legal, Product, Tech"></div>
  <div id="a-err" class="err" role="alert"></div>
  <div class="bar"><button class="btn" data-act="assess-save" data-id="${c.id}">Save assessment and plan actions</button></div></div>`;
 }else if(c.status==="implementing"||c.status==="signoff"){
  const open=c.actions.filter(a=>!a.done).length,locked=c.status==="signoff";
  work=`${assessmentPanel(c)}<div class="panel"><h2>Actions</h2>${c.actions.map(a=>`<label class="check"><input type="checkbox" data-act="action-toggle" data-id="${c.id}" data-aid="${a.id}" ${a.done?"checked":""} ${locked?"disabled":""}><span class="${a.done?"done":""}">${esc(a.title)}<br><span class="meta">${esc(uname(a.owner))}${a.due?", due "+fmt(a.due)+" ("+daysLabel(a.due)+")":""}</span></span></label>`).join("")||'<p style="color:var(--muted)">No actions yet.</p>'}
  ${locked?"":`<div class="grid" style="grid-template-columns:2fr 1fr 1fr;margin-top:12px;align-items:end"><div class="field" style="margin:0"><label for="n-title">New action</label><input id="n-title" placeholder="What needs to be done"></div><div class="field" style="margin:0"><label for="n-owner">Owner</label><select id="n-owner">${owners}</select></div><div class="field" style="margin:0"><label for="n-due">Due</label><input type="date" id="n-due"></div></div><div id="n-err" class="err" role="alert"></div><div class="bar"><button class="btn outline" data-act="action-add" data-id="${c.id}">Add action</button><button class="btn outline" data-act="ticket" data-id="${c.id}">Send as tickets</button></div>`}</div>
  <div class="panel"><h2>Evidence</h2>${c.evidence.map(e=>`<p>${esc(e)}</p>`).join("")||'<p style="color:var(--muted)">Nothing attached yet. Sign-off needs at least one piece of evidence.</p>'}
  ${locked?`<p><b>Waiting for sign-off.</b> Requested by ${esc(uname(c.requestedBy))}. A second person has to sign off.</p><div id="s-err" class="err" role="alert"></div><div class="bar"><button class="btn" data-act="signoff" data-id="${c.id}">Sign off and close</button><button class="btn outline" data-act="reopen" data-id="${c.id}">Send back</button></div>`
  :`<div class="bar"><button class="btn outline" data-act="evidence" data-id="${c.id}">Attach</button><button class="btn" data-act="request-signoff" data-id="${c.id}" ${open||!c.evidence.length?"disabled":""}>Request sign-off</button></div>${open?`<p class="field"><span class="hint">${open} action${open>1?"s":""} still open.</span></p>`:""}`}</div>`;
 }else if(c.status==="closed"){
  work=`${assessmentPanel(c)}<div class="panel"><h2>Closed</h2><p>${c.signedBy?`Signed off by ${esc(uname(c.signedBy))} on ${fmt(c.closedAt)}.`:`Closed on ${fmt(c.closedAt)}${c.closedNote?": "+esc(c.closedNote):"."}`}</p>${c.evidence.length?`<p>Evidence: ${c.evidence.map(esc).join(", ")}</p>`:""}<div class="bar"><button class="btn outline" data-act="casefile" data-id="${c.id}">Show case file</button></div></div>`;
 }else if(c.status==="dismissed"){
  work=`<div class="panel"><h2>Dismissed</h2><p>${esc(c.dismissedReason)}</p><p class="meta">By ${esc(uname(c.dismissedBy))}</p><div class="bar"><button class="btn outline" data-act="restore" data-id="${c.id}">Move back to triage</button></div></div>`;
 }
 return `<button class="back" data-act="back">Back</button>
 <div class="meta" style="margin-bottom:6px"><span class="pill blue">${esc(c.type)}</span>${pill(c.urgency)}${c.flags.map(f=>`<span class="pill brass">${esc(f)}</span>`).join("")}<span class="pill">${esc(STATUS_LABEL[c.status])}</span></div>
 <h1 style="margin-bottom:6px">${esc(c.title)}</h1>
 <p class="meta" style="margin-bottom:16px"><span>${esc(c.authority)}</span>${c.published?`<span>Published ${fmt(c.published)}</span>`:""}<span>Source: <a href="${esc(c.source.url)}" target="_blank" rel="noopener">${esc(c.source.label)}</a></span>${c.dupes?`<span>${c.dupes} duplicate news item merged</span>`:""}</p>
 <div class="grid g2"><div class="grid" style="align-content:start">
  <div class="panel"><h2>What happened</h2><p>${esc(c.summary)}</p>
   <div class="sowhat">${c.sowhat.confirmed?"":'<span class="ai">Drafted by AI, not yet confirmed by a person</span>'}<b>So what?</b> <span id="sw-text">${esc(c.sowhat.text)}</span></div>
   ${c.sowhat.confirmed?"":`<div class="bar" style="margin-top:0"><button class="btn small" data-act="sw-confirm" data-id="${c.id}">Confirm wording</button><button class="btn outline small" data-act="sw-edit" data-id="${c.id}">Edit</button></div>`}</div>
  ${work}</div>
  <div class="grid" style="align-content:start">
   <div class="panel"><h2>Timeline</h2><ul class="timeline">${c.timeline.map((t,i)=>{const next=!t[2]&&(i===0||c.timeline[i-1][2]);return `<li class="${t[2]?"done":next?"next":""}"><b>${esc(t[0])}</b>${t[1]?"<br>"+fmt(t[1])+(t[2]?"":", "+daysLabel(t[1])):"<br>Date not set"}</li>`;}).join("")}</ul></div>
   <div class="panel"><h2>Obligations affected</h2>${c.obligations.map(id=>{const o=obl(id);return o?`<p><a href="#" data-act="open-obl" data-id="${o.id}">${esc(o.title)}</a><br><span class="meta">${esc(inst(o.instrument).short)}, ${esc(o.ref)}</span></p>`:"";}).join("")||'<p style="color:var(--muted)">No obligation linked yet. The agent proposal for a new obligation may still be waiting.</p>'}
   <p class="meta">${c.accounts.length===ACCOUNTS.length?"All accounts":esc(c.accounts.join(", "))} | ${esc(c.regimes.join(", "))}</p></div>
  </div></div>`;
}
function assessmentPanel(c){const a=c.assessment;if(!a||!a.saved)return"";return `<div class="panel"><h2>Impact assessment</h2><dl class="kv"><dt>Applies</dt><dd>${esc(a.applies)}</dd><dt>Why</dt><dd>${esc(a.why)}</dd><dt>What must change</dt><dd>${esc(a.change)||"Nothing"}</dd><dt>Internal deadline</dt><dd>${a.deadline?fmt(a.deadline):"Not set"}</dd><dt>Effort</dt><dd>${esc({S:"Small",M:"Medium",L:"Large"}[a.effort])}</dd><dt>Contributors</dt><dd>${esc(a.contributors)}</dd></dl></div>`;}

function vInventory(){
 const ui=S.ui;let list=S.obligations;
 if(ui.invInstrument)list=list.filter(o=>o.instrument===ui.invInstrument);
 if(ui.invApplies)list=list.filter(o=>o.applies===ui.invApplies);
 if(ui.invService)list=list.filter(o=>o.service.includes(ui.invService));
 if(ui.invStatus)list=list.filter(o=>o.status===ui.invStatus);
 list=list.filter(o=>oblInFoot(o));
 const A={yes:["Applies","green"],no:["Does not apply",""],assess:["Under assessment","amber"]};
 return `<div class="head"><div><h1>Inventory</h1><p>${S.obligations.length} obligations across ${S.instruments.length} instruments, each scoped by entity, service and client, with an owner, a decision on whether it applies and a separate compliance status.</p></div></div>
 <div class="filters"><select data-bind="invInstrument" aria-label="Instrument"><option value="">All instruments</option>${S.instruments.map(i=>`<option value="${i.id}" ${ui.invInstrument===i.id?"selected":""}>${esc(i.short)} (${S.obligations.filter(o=>o.instrument===i.id).length})</option>`).join("")}</select>
 <select data-bind="invApplies" aria-label="Applicability"><option value="">Any decision</option><option value="yes" ${ui.invApplies==="yes"?"selected":""}>Applies</option><option value="assess" ${ui.invApplies==="assess"?"selected":""}>Under assessment</option><option value="no" ${ui.invApplies==="no"?"selected":""}>Does not apply</option></select>
 <select data-bind="invService" aria-label="Service type"><option value="">Any service</option>${SERVICES.map(x=>`<option ${ui.invService===x?"selected":""}>${x}</option>`).join("")}</select>
 <select data-bind="invStatus" aria-label="Compliance status"><option value="">Any status</option>${Object.keys(CSTATUS).map(k=>`<option value="${k}" ${ui.invStatus===k?"selected":""}>${CSTATUS[k][0]}</option>`).join("")}</select></div>
 <div class="rows">${list.map(o=>{const open=S.changes.filter(c=>c.obligations.includes(o.id)&&!["closed","dismissed"].includes(c.status)).length;return `<button class="row" data-act="open-obl" data-id="${o.id}"><div class="meta"><span class="pill brass">${esc(inst(o.instrument).short)}</span>${inst(o.instrument).binding?"":'<span class="pill">Guidance</span>'}<span class="pill ${A[o.applies][1]}">${A[o.applies][0]}</span>${o.applies==="yes"?cpill(o):""}${o.pendingApplies?'<span class="pill amber">Change waiting for approval</span>':""}${open?`<span class="pill blue">${open} open change${open>1?"s":""}</span>`:""}</div><h3>${esc(o.title)}</h3><div class="meta"><span>${esc(o.ref)}</span><span>${esc(o.service.length===SERVICES.length?"All services":o.service.join(", "))}</span><span>${esc(o.accounts.join(", "))}</span><span>${esc(uname(o.owner))}</span></div></button>`;}).join("")||'<div class="empty">No obligations match. Clear a filter or widen the regulatory scope.</div>'}</div>`;
}
function verAt(o,asOf){const d=asOf||today();let v=o.versions[0];for(const x of o.versions){if(!x.from||x.from<=d)v=x;}return v;}
function sentences(t){return t.match(/[^.]+\.?/g).map(s=>s.trim()).filter(Boolean);}
function diffHtml(a,b){const A=sentences(a),B=sentences(b);return B.map(s=>A.includes(s)?esc(s):`<ins>${esc(s)}</ins>`).concat(A.filter(s=>!B.includes(s)).map(s=>`<del>${esc(s)}</del>`)).join(" ");}
function vObligation(v){
 const o=obl(v.id);if(!o)return"<p>Not found.</p>";const i=inst(o.instrument),ui=S.ui;
 const sel=v.ver?o.versions.find(x=>x.n===v.ver):o.versions[o.versions.length-1];
 const prev=o.versions.find(x=>x.n===sel.n-1);
 const text=ui.diff&&prev?diffHtml(prev[ui.lang],sel[ui.lang]):esc(sel[ui.lang]);
 const rel=S.changes.filter(c=>c.obligations.includes(o.id));
 const canApprove=o.pendingApplies&&o.pendingApplies.by!==S.user;const es=oblEntities(o),multi=es.length>1;
 return `<button class="back" data-act="back">Back</button>
 <div class="meta" style="margin-bottom:6px"><span class="pill brass">${esc(i.short)}</span><span class="pill">${esc(i.regime)}</span><span class="pill ${i.binding?"":"amber"}">${i.binding?"Binding":"Guidance, comply or explain"}</span>${o.applies==="yes"?cpill(o):""}</div>
 <h1 style="margin-bottom:14px">${esc(o.title)}</h1>
 <div class="filters"><button class="chip" data-act="lang" data-l="en" aria-pressed="${ui.lang==="en"}">English</button><button class="chip" data-act="lang" data-l="sv" aria-pressed="${ui.lang==="sv"}">Svenska</button>
 ${o.versions.map(x=>`<button class="chip" data-act="ver" data-n="${x.n}" aria-pressed="${sel.n===x.n}">Version ${x.n}${x.from?", from "+fmt(x.from):""}</button>`).join("")}
 ${prev?`<button class="chip" data-act="diff" aria-pressed="${ui.diff}">Show what changed</button>`:""}</div>
 <div class="lagrum" style="margin-bottom:16px"><div class="margin"><b>§</b><small>${esc(i.short)}<br>${esc(o.ref)}</small></div><div class="body" lang="${ui.lang}">${text}</div></div>
 <div class="grid g2"><div class="grid" style="align-content:start">
  <div class="panel sand"><h2>Who and what it covers</h2><dl class="kv">
   <dt>Legal entity</dt><dd class="facets">${o.entity.map(x=>`<span class="pill brass">${esc(x)}</span>`).join("")}</dd>
   <dt>Service</dt><dd class="facets">${(o.service.length===SERVICES.length?["All services"]:o.service).map(x=>`<span class="pill brass">${esc(x)}</span>`).join("")}</dd>
   <dt>Client category</dt><dd class="facets">${o.client.length?o.client.map(x=>`<span class="pill brass">${esc(x)}</span>`).join(""):"Not client-specific"}</dd>
   <dt>Product</dt><dd>${esc(o.product)}</dd><dt>Accounts</dt><dd>${esc(o.accounts.join(", "))}</dd>
   <dt>Channel</dt><dd>${o.channel.length?esc(o.channel.join(", ")):"Not channel-specific"}</dd><dt>Lifecycle stage</dt><dd>${esc(o.stage)}</dd></dl></div>
  <div class="panel"><h2>The duty</h2><dl class="kv"><dt>Type</dt><dd>${esc(o.duty)}</dd><dt>Trigger and frequency</dt><dd>${esc(o.trigger)}</dd><dt>Record retention</dt><dd>${esc(o.retention)}</dd><dt>Sanction exposure</dt><dd>${esc(o.sanction)}</dd></dl></div>
  <div class="panel"><h2>Does it apply to us?</h2>
   <div class="field"><label for="o-applies">Decision</label><select id="o-applies"><option value="yes" ${o.applies==="yes"?"selected":""}>Applies</option><option value="assess" ${o.applies==="assess"?"selected":""}>Under assessment</option><option value="no" ${o.applies==="no"?"selected":""}>Does not apply</option></select></div>
   <div class="field"><label for="o-reason">Reason</label><textarea id="o-reason">${esc(o.reason)}</textarea><span class="hint">A reasoned "does not apply" is as valuable to an auditor as an "applies".</span></div>
   ${o.pendingApplies?`<p><span class="pill amber">Waiting for approval</span> ${esc(uname(o.pendingApplies.by))} proposed "${esc({yes:"Applies",no:"Does not apply",assess:"Under assessment"}[o.pendingApplies.applies])}".</p><div id="o-err" class="err" role="alert"></div><div class="bar"><button class="btn small" data-act="applies-approve" data-id="${o.id}">Approve</button><button class="btn outline small" data-act="applies-reject" data-id="${o.id}">Reject</button></div>`
   :`<div id="o-err" class="err" role="alert"></div><div class="bar"><button class="btn" data-act="applies-propose" data-id="${o.id}">Send for approval</button></div>`}</div>
  ${interpPanel(o)}<div class="panel"><h2>Linked internal items</h2>${o.internal.map(x=>`<p>${esc(x)}</p>`).join("")||'<p style="color:var(--muted)">Nothing linked yet.</p>'}<div class="search" style="margin:8px 0 0"><input id="o-link" placeholder="Policy, procedure or control" aria-label="New linked item"><button class="btn outline" data-act="link-add" data-id="${o.id}">Add link</button></div></div>
 </div><div class="grid" style="align-content:start">
  <div class="panel"><h2>Where we stand</h2><p style="color:var(--muted);font-size:var(--fs-meta)">Whether a rule applies and whether we comply are two different facts, recorded separately.</p>

   ${o.statusNote?`<p><span class="pill ${CSTATUS[o.status][1]}">${CSTATUS[o.status][0]}</span> ${esc(o.statusNote)}</p>`:""}
   <div class="field"><label for="o-risk">Risk if we fail</label><select id="o-risk" data-act-change="risk" data-id="${o.id}">${["Low","Medium","High"].map(k=>`<option ${o.risk===k?"selected":""}>${k}</option>`).join("")}</select></div>
   <dl class="kv"><dt>Next review</dt><dd>${fmt(o.review)}, ${daysLabel(o.review)}</dd></dl>${multi&&o.applies==="yes"?entityPanel(o,es):""}</div>
  ${gapsPanel(o)}${historyPanel(o)}
  <div class="panel"><h2>How we handle it</h2><dl class="kv"><dt>First-line owner</dt><dd><select id="o-owner" data-act-change="owner" data-id="${o.id}" aria-label="Owner">${USERS.map(u=>`<option value="${u.id}" ${o.owner===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></dd><dt>Compliance contact</dt><dd>${esc(uname(o.second))}</dd><dt>Process</dt><dd>${esc(o.process)||"Not mapped"}</dd><dt>System</dt><dd>${esc(o.system)||"Not mapped"}</dd><dt>Evidence kept</dt><dd>${esc(o.evidence)||"Not mapped"}</dd></dl></div>
  <div class="panel"><h2>Where it comes from</h2><dl class="kv"><dt>Instrument</dt><dd>${esc(i.name)}</dd><dt>Official reference</dt><dd>${esc(i.official)}</dd><dt>Level</dt><dd>${esc(i.level)}</dd><dt>Implements</dt><dd>${esc(i.implements)}</dd></dl>
   ${o.related.length?`<h3 style="margin:14px 0 8px">Related obligations</h3>${o.related.map(id=>{const r=obl(id);return r?`<p><a href="#" data-act="open-obl" data-id="${r.id}">${esc(r.title)}</a><br><span class="meta">${esc(inst(r.instrument).short)}, ${inst(r.instrument).binding?"binding":"guidance"}</span></p>`:"";}).join("")}`:""}</div>
  <div class="panel"><h2>Record</h2><dl class="kv"><dt>Created by</dt><dd>${esc(o.createdBy)}, ${esc(o.model)}</dd><dt>Verified by</dt><dd>${esc(uname(o.verifiedBy))}</dd><dt>Last verified</dt><dd>${fmt(o.verified)}</dd></dl>
  <div class="bar"><button class="btn outline small" data-act="reverify" data-id="${o.id}">Re-verify</button><button class="btn outline small" data-act="wrong" data-id="${o.id}">Report error</button></div></div>
  <div class="panel"><h2>Related changes</h2>${rel.map(c=>`<p><a href="#" data-act="open-change" data-id="${c.id}">${esc(c.title)}</a><br><span class="meta">${esc(STATUS_LABEL[c.status])}</span></p>`).join("")||'<p style="color:var(--muted)">No changes tracked for this obligation.</p>'}</div>

const SYN={fees:["costs","charges"],fee:["costs","charges"],price:["costs","charges"],nudging:["appropriateness","warning"],nudge:["appropriateness","warning"],robo:["automated","suitability"],robot:["automated"],algorithm:["automated"],kyc:["due diligence","aml"],onboarding:["due diligence","knowledge"],outsourcing:["third-party","ict"],cloud:["ict","third-party"],vendor:["third-party","ict"],move:["transfer"],flytt:["transfer"],skatt:["tax"],rådgivning:["advice","suitability"],byte:["switch"],analys:["research"]};
function searchAll(q,asOf){
 const words=q.toLowerCase().split(/[^a-zåäö0-9:]+/).filter(w=>w.length>1);if(!words.length)return[];
 const res=[];
 for(const o of S.obligations){const v=verAt(o,asOf),hay=(o.title+" "+v.en+" "+v.sv+" "+o.tags.join(" ")+" "+inst(o.instrument).name+" "+inst(o.instrument).short+" "+o.service.join(" ")+" "+o.stage+" "+o.duty+" "+o.product+" "+o.channel.join(" ")).toLowerCase();
  let score=0,concept=false;for(const w of words){if(o.title.toLowerCase().includes(w))score+=3;if(hay.includes(w))score+=2;else for(const s of (SYN[w]||[])){if(hay.includes(s)){score+=1;concept=true;}}}
  if(score)res.push({kind:"obligation",o,v,score,concept});}
 for(const c of S.changes){const hay=(c.title+" "+c.summary+" "+c.authority).toLowerCase();let score=0;for(const w of words)if(hay.includes(w))score+=2;if(score)res.push({kind:"change",c,score});}
 return res.sort((a,b)=>b.score-a.score);
}
function hl(t,q){let out=esc(t);q.toLowerCase().split(/[^a-zåäö0-9:]+/).filter(w=>w.length>2).forEach(w=>{out=out.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");});return out;}
