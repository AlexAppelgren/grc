<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bleqq: compliance inventory and watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Colour, radius and state values are taken from @sebgroup/green-tokens (2023 theme, Apache-2.0).
   SEB Sans Serif is licensed to SEB only, so this prototype falls back to a neutral grotesk.
   Brand: bleqq is a play on the Swedish word for ink. Only the logo carries that idea; the interface stays plain. */
:root{
  --brand:#003824;--bg:#f4f5f5;--surface:#ffffff;--surface-2:#f7f8f7;--sand:#f8f6f1;--sand-2:#efe9dc;--sand-3:#e7ddcb;
  --line:#dfe1e1;--line-strong:#777e7c;--text:#0a0b0b;--muted:#636967;--bronze:#685631;
  --accent:#003824;--btn:#0a0b0b;--btn-text:#ffffff;--focus:#005fb3;
  --red:#b92f13;--red-soft:#fdebe8;--amber:#8f530a;--amber-soft:#fce8cf;--green:#026436;--green-soft:#dcefdc;
  --blue:#005fb3;--blue-soft:#e6f3ff;--grey-soft:#eaebeb;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0b0b;--surface:#191a1a;--surface-2:#282a29;--sand:#231d10;--sand-2:#342b18;--sand-3:#453921;
  --line:#454a48;--line-strong:#a0a6a4;--text:#f7f8f7;--muted:#abb0ae;--bronze:#d6c7a8;
  --accent:#d6c7a8;--btn:#ffffff;--btn-text:#0a0b0b;--focus:#66b8ff;
  --red:#f08975;--red-soft:#3a1a14;--amber:#f5b970;--amber-soft:#3a2810;--green:#8ae58d;--green-soft:#12301c;
  --blue:#66b8ff;--blue-soft:#10273d;--grey-soft:#313533;
}}
:root[data-theme="dark"]{
  --bg:#0a0b0b;--surface:#191a1a;--surface-2:#282a29;--sand:#231d10;--sand-2:#342b18;--sand-3:#453921;
  --line:#454a48;--line-strong:#a0a6a4;--text:#f7f8f7;--muted:#abb0ae;--bronze:#d6c7a8;
  --accent:#d6c7a8;--btn:#ffffff;--btn-text:#0a0b0b;--focus:#66b8ff;
  --red:#f08975;--red-soft:#3a1a14;--amber:#f5b970;--amber-soft:#3a2810;--green:#8ae58d;--green-soft:#12301c;
  --blue:#66b8ff;--blue-soft:#10273d;--grey-soft:#313533;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:var(--text);text-underline-offset:3px}
h1,h2,h3{font-weight:500;line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:400}h2{font-size:1.25rem}h3{font-size:1rem}
p{margin:0 0 .75rem}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--brand);color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px 20px}
.logo{display:block;width:100%;height:auto}
.brand .logo{max-width:196px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mbrand{display:none}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:999px;font-size:.95rem}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:#f8f6f1;color:#003824;font-weight:600}
.nav button[aria-current="page"] .count{background:#003824;color:#fff}
.nav .count{background:#efe9dc;color:#003824;border-radius:999px;font-size:.75rem;font-weight:700;padding:1px 8px}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.18);margin:12px 8px}
.who{margin:18px 4px 0;padding:12px;border:1px solid rgba(255,255,255,.25);border-radius:12px;font-size:.85rem;color:rgba(255,255,255,.75)}
.who b{display:block;color:#fff;font-weight:600}
.who button{margin-top:10px;background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:6px 10px;font-size:.82rem;width:100%}

main{padding:32px 36px 96px;max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head p{color:var(--muted);margin:6px 0 0;max-width:70ch}
.back{background:none;border:0;color:var(--text);padding:0;margin-bottom:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.notice{background:var(--sand);color:var(--text);border-left:3px solid var(--bronze);padding:8px 12px;font-size:.85rem;margin-bottom:20px}

.grid{display:grid;gap:16px}.grid>*{min-width:0}
.field input,.field select,.field textarea,.kv select{width:100%;max-width:100%}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel>h2,.panel>h3{margin-bottom:12px}
.panel.sand{background:var(--sand);border-color:var(--sand-2)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;width:100%}
.stat b{display:block;font-size:2.25rem;font-weight:400;line-height:1;letter-spacing:-.02em;margin-bottom:4px}
.stat span{color:var(--muted);font-size:.9rem}
button.stat:hover{border-color:var(--text)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select,.filters input[type=date],.field input,.field select,.field textarea,.search input,.kv select{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;min-height:44px}
.chip{background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;font-size:.88rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-text);font-weight:600}

.rows{display:grid;gap:10px}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
button.row:hover{border-color:var(--text)}
.row h3{font-weight:600;font-size:1.02rem;margin:6px 0}
.meta{color:var(--muted);font-size:.86rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--grey-soft);color:var(--text)}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.brass{background:var(--sand-2);color:var(--bronze)}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line-strong);border-radius:16px}

.btn{background:var(--btn);color:var(--btn-text);border:1px solid var(--btn);border-radius:999px;padding:10px 20px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--text)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.small{padding:6px 14px;min-height:36px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.barwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.barwrap .bar{margin-top:2px}

.sowhat{background:var(--sand);border-radius:12px;padding:12px 14px;margin:14px 0;line-height:1.5}
.feature .sowhat,.panel.sand .sowhat,.answer .sowhat{background:var(--surface)}
.sowhat .ai{font-size:.8rem;color:var(--bronze);font-weight:600;display:block;margin-bottom:2px}
.kicker{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.feature{background:var(--sand);border:1px solid var(--sand-2);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px}
.feature h2.lead{font-size:1.9rem;font-weight:400;max-width:24ch;line-height:1.15}
.home{display:grid;grid-template-columns:1fr 1.7fr;gap:16px;align-items:stretch}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dates{display:flex;flex-direction:column;gap:16px}
.dates>div{display:flex;gap:12px;align-items:flex-start}
.dates i{width:12px;height:12px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--text)}
.dates i.red{background:var(--red)}.dates i.amber{background:var(--amber)}.dates i.blue{background:var(--blue)}.dates i.brass{background:var(--bronze)}
.dates b{font-weight:700}.dates b.red{color:var(--red)}.dates b.amber{color:var(--amber)}.dates b.blue{color:var(--blue)}.dates b.brass{color:var(--bronze)}
.dates a{text-decoration:none}.dates a:hover{text-decoration:underline}
.statusbar{display:flex;gap:3px;margin:4px 0 10px}.statusbar i{height:10px;border-radius:999px;display:block}
.legend{display:flex;justify-content:space-between;font-size:.92rem;padding:3px 0}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:16px}
.brief{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.brief:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.brief a{font-weight:600;font-size:1.04rem;text-decoration:none}.brief a:hover{text-decoration:underline}
.brief p{color:var(--muted);font-size:.92rem;margin:6px 0 8px}
.roster{display:grid;gap:12px;align-items:start;margin-bottom:18px}
.roster .q{display:flex;flex-direction:column;gap:8px;min-width:0}
.roster .qh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:2px solid var(--text);font-weight:600;font-size:.95rem}
.roster .qh span{color:var(--muted);font-weight:400;font-size:.82rem}
.rcard{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;display:flex;flex-direction:column;gap:3px;width:100%}
.rcard:hover{border-color:var(--line-strong)}
.rcard[aria-pressed="true"]{background:var(--sand);border-color:var(--text)}
.rcard b{font-size:.9rem}.rcard b.red{color:var(--red)}.rcard b.amber{color:var(--amber)}.rcard b.blue{color:var(--blue)}.rcard b.brass{color:var(--bronze)}
.rcard span{font-size:.84rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.rcard small{font-size:.76rem;color:var(--muted)}
.rdetail{display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.inline-detail{display:none}
.nib{width:1em;height:1em;vertical-align:-.12em;margin-right:.4em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 14px 24px;color:var(--muted);font-size:.92rem}
.timeline li:before{content:"";position:absolute;left:4px;top:7px;width:9px;height:9px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface)}
.timeline li:after{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child:after{display:none}
.timeline li.done{color:var(--text)}.timeline li.done:before{background:var(--accent);border-color:var(--accent)}
.timeline li.next:before{border-color:var(--bronze);background:var(--bronze)}

.lagrum{display:grid;grid-template-columns:96px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lagrum .margin{background:var(--sand);color:var(--bronze);padding:20px 10px;text-align:center}
.lagrum .margin b{display:block;font-size:2.2rem;font-weight:400;line-height:1}
.lagrum .margin small{font-size:.76rem;line-height:1.3;display:block;margin-top:8px}
.lagrum .body{padding:20px 24px;font-size:1.12rem;line-height:1.65;max-width:70ch}
.lagrum ins{background:var(--green-soft);color:var(--green);text-decoration:none;padding:1px 3px;border-radius:4px}
.lagrum del{background:var(--red-soft);color:var(--red);padding:1px 3px;border-radius:4px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;font-size:.94rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.facets{display:flex;gap:6px;flex-wrap:wrap}

.field{display:grid;gap:5px;margin-bottom:14px}
.field label{font-weight:600;font-size:.9rem}
.field textarea{min-height:76px;resize:vertical}
.field .hint{color:var(--muted);font-size:.82rem}
.err{color:var(--red);font-size:.88rem;margin-top:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.check .done{text-decoration:line-through;color:var(--muted)}

.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1 1 0;min-width:0;font-size:1.05rem}
mark{background:var(--sand-3);color:inherit;border-radius:3px;padding:0 2px}
.answer{background:var(--sand);border:1px solid var(--sand-2);border-radius:16px;padding:20px;margin-bottom:16px}
.answer ol{margin:8px 0 0;padding-left:20px;font-size:.9rem;color:var(--muted)}
.bars div{display:grid;grid-template-columns:140px 1fr 28px;gap:8px;align-items:center;margin-bottom:10px;font-size:.9rem}
.bars i{display:block;height:10px;border-radius:999px;background:var(--accent)}
.heat{width:100%;border-collapse:collapse;font-size:.85rem}
.heat th,.heat td{padding:7px;text-align:center;border:1px solid var(--line)}
.heat th{font-weight:600}
.heat th:first-child,.heat td:first-child{text-align:left}
.scroll{overflow-x:auto}
.log{font-size:.9rem}.log div{padding:10px 0;border-bottom:1px solid var(--line)}.log div:last-child{border-bottom:0}.log time{color:var(--muted);font-size:.8rem;display:block}

.modal{position:fixed;inset:0;background:rgba(10,11,11,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .box{background:var(--surface);border-radius:20px;padding:24px;max-width:560px;width:100%;max-height:86vh;overflow:auto;border:1px solid var(--line)}
.modal pre{white-space:pre-wrap;font-family:var(--sans);font-size:.88rem;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:46vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#0a0b0b;color:#fff;padding:12px 18px;border-radius:999px;font-size:.92rem;z-index:50;max-width:90vw;border:1px solid rgba(255,255,255,.2)}
.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}.side{display:none}
  .mbrand{display:block;margin:0 0 12px}.mbrand .logo{width:150px}
  main{padding:20px 16px 100px}
  h1{font-size:1.6rem}
  .home,.pair,.rdetail{grid-template-columns:1fr}.feature{padding:20px}.feature h2.lead{font-size:1.45rem}
  .roster{grid-template-columns:1fr!important}.roster .q.none{display:none}
  .below-detail{display:none}.inline-detail{display:block;padding:4px 2px 12px}
  .bar{justify-content:flex-end;flex-wrap:nowrap}
  .bar .btn{order:2;flex:0 1 auto;min-width:0;padding:10px 16px;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .btn.small{padding:6px 12px;font-size:.86rem}
  .bar .btn:not(.ghost):not(.danger){order:3}
  .barwrap{flex-direction:column;align-items:flex-end;gap:6px}.barwrap .bar{align-self:stretch}
  .head>.btn{margin-left:auto}
  .panel>.btn{display:block;margin-left:auto}
  .search .btn{white-space:nowrap}
  .g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:10px}
  .lagrum{grid-template-columns:1fr}.lagrum .margin{display:flex;gap:10px;align-items:baseline;text-align:left;padding:10px 16px}
  .lagrum .margin b{font-size:1.4rem}.lagrum .margin small{margin:0}.lagrum .body{padding:16px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--brand);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 2px 8px;font-size:.72rem;display:grid;justify-items:center;gap:3px;position:relative}
  .tabbar button[aria-current="page"]{color:#fff;font-weight:600}
  .tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .dot{position:absolute;top:6px;right:calc(50% - 20px);background:#efe9dc;color:#003824;border-radius:999px;font-size:.65rem;font-weight:700;padding:0 6px}
  .bars div{grid-template-columns:110px 1fr 24px}
}
@media (max-width:380px){.bar .btn{padding:10px 12px;font-size:.9rem}.bar .btn.small{padding:6px 10px}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
.ent{display:grid;grid-template-columns:1fr minmax(150px,auto);gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ent:last-of-type{border-bottom:0}
.ent small{color:var(--muted);display:block;font-size:.82rem}
.ent select{width:100%;max-width:100%}
.meter{height:10px;border-radius:999px;background:var(--grey-soft);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.run{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.run:last-child{border-bottom:0}
.run small{color:var(--muted)}
.hist{padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist:last-child{border-bottom:0}
.agent h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.picks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 12px}
.picks label{display:inline-flex;gap:6px;align-items:center;font-size:.92rem;min-height:32px}
@media (max-width:820px){.ent{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="overlay"></div>

<script>
"use strict";
/* ---------- sample data ---------- */
const USERS=[
 {id:"sara",name:"Sara Lindqvist",role:"Compliance officer"},
 {id:"johan",name:"Johan Berg",role:"Obligation owner, digital investing"},
 {id:"maria",name:"Maria Ek",role:"Approver, head of compliance"},
 {id:"erik",name:"Erik Holm",role:"Administrator"}];
const REGIMES=["Securities","Insurance","Tax","Data protection","AML","AI and ICT"];
const ACCOUNTS=["ISK","AF","Depå","KF","Pension"];
const ENTITIES=["Bank","Insurer","Fund company"];
const SERVICES=["Advice","Non-advised","Execution only","Portfolio management","Custody","Insurance distribution"];
const CLIENTS=["Retail","Professional"];
const CSTATUS={compliant:["Compliant","green"],partly:["Partly compliant","amber"],gap:["Gap","red"],unknown:["Not assessed",""]};
const URGENCY=["Act now","Within 3 months","6+ months","Monitor","No action"];
const UCLASS={"Act now":"red","Within 3 months":"amber","6+ months":"blue","Monitor":"","No action":"green"};
const STATUS_LABEL={new:"Needs triage",assigned:"Assigned",assessing:"Assessment in progress",implementing:"Implementing",signoff:"Waiting for sign-off",closed:"Closed",dismissed:"Dismissed"};

var seed=function(){return{
 user:"sara",view:{name:"today"},stack:[],
 footprint:{regimes:[...REGIMES],accounts:[...ACCOUNTS],entities:[...ENTITIES],services:[...SERVICES],clients:[...CLIENTS]},
 org:{entities:[
   {id:"e-bank",name:"Example Bank AB",kind:"Bank",orgnr:"556000-0001",licences:["Banking business","Securities business, LVM 2 kap."]},
   {id:"e-ins",name:"Example Liv Försäkring AB",kind:"Insurer",orgnr:"516000-0002",licences:["Life insurance business","Insurance distribution"]},
   {id:"e-fund",name:"Example Fonder AB",kind:"Fund company",orgnr:"556000-0003",licences:["Fund operations, LVF"]}],

 $("side").innerHTML=`<div class="brand">${LOGO_SIDE}<span class="sr">bleqq [blɛkː]</span></div><nav class="nav" aria-label="Main">${NAV.map(([k,l],i)=>`${k==="roadmap"||k==="agents"?"<hr>":""}<button data-act="nav" data-v="${k}" ${cur===k?'aria-current="page"':""}>${l}${k==="watch"&&c.triage+c.props?`<span class="count">${c.triage+c.props}</span>`:""}</button>`).join("")}</nav>
 <div class="who">Signed in as<b>${esc(me().name)}</b>${esc(me().role)}<button data-act="switch">Switch user</button></div>`;
 const tabs=[["today","Today"],["watch","Watch"],["inventory","Inventory"],["search","Search"],["more","More"]];
 const moreOn=["week","gaps","roadmap","reports","agents","audit","settings"].includes(cur);
 $("tabbar").innerHTML=tabs.map(([k,l])=>`<button data-act="${k==="more"?"more":"nav"}" data-v="${k}" ${(cur===k||(k==="more"&&moreOn))?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}${k==="watch"&&c.triage+c.props?`<span class="dot">${c.triage+c.props}</span>`:""}</button>`).join("");
}
function render(){renderShell();const v=S.view;const fn={today:vToday,watch:vWatch,change:vChange,inventory:vInventory,obligation:vObligation,search:vSearch,week:vWeek,roadmap:vRoadmap,reports:vReports,audit:vAudit,settings:vSettings,gaps:vGaps,gap:vGap,agents:vAgents}[v.name]||vToday;
 $("main").innerHTML=`<div class="mbrand">${LOGO_MOB}<span class="sr">bleqq [blɛkː]</span></div><div class="notice">Prototype with sample data, not verified legal content. Your actions stay in this browser.</div>`+fn(v);
 if(v.name==="search")renderResults();save();}

/* ---------- views ---------- */
function changeRow(c){return `<button class="row" data-act="open-change" data-id="${c.id}"><div class="meta"><span class="pill blue">${esc(c.type)}</span>${pill(c.urgency)}${c.flags.map(f=>`<span class="pill brass">${esc(f)}</span>`).join("")}<span>${esc(c.authority)}</span></div><h3>${esc(c.title)}</h3><p style="margin:0 0 8px;color:var(--muted);font-size:.92rem"><b style="color:var(--text)">So what?</b> ${esc(c.sowhat.text)}</p><div class="meta"><span>${esc(STATUS_LABEL[c.status])}${c.owner?", "+esc(uname(c.owner)):""}</span>${c.keyDate?`<span>${esc(c.keyLabel)} ${fmt(c.keyDate)}, ${daysLabel(c.keyDate)}</span>`:""}<span>${c.accounts.length===ACCOUNTS.length?"All accounts":esc(c.accounts.join(", "))}</span></div></button>`;}
function upcomingList(){return S.changes.filter(c=>c.keyDate&&c.status!=="dismissed"&&c.status!=="closed"&&daysTo(c.keyDate)>=0).sort((a,b)=>a.keyDate.localeCompare(b.keyDate));}

const URANK={"Act now":0,"Within 3 months":1,"6+ months":2,"Monitor":3,"No action":4};
function weekItems(){return S.changes.filter(c=>c.week&&c.status!=="dismissed"&&inFoot(c)).sort((x,y)=>URANK[x.urgency]-URANK[y.urgency]);}
function leadItem(){const w=weekItems();if(w.length)return w[0];const o=S.changes.filter(c=>!["closed","dismissed"].includes(c.status)&&inFoot(c)).sort((x,y)=>URANK[x.urgency]-URANK[y.urgency]);return o[0]||null;}
function weekLabel(){const d=new Date(today()+"T00:00:00"),day=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-day);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
 const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const wk=Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7);
 const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
 return `Week ${wk}, ${mon.getDate()}${mon.getMonth()!==sun.getMonth()?" "+MN[mon.getMonth()]:""} to ${sun.getDate()} ${MN[sun.getMonth()]} ${sun.getFullYear()}`;}
function longDate(){const d=new Date(today()+"T00:00:00");return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+" "+d.getDate()+" "+["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]+" "+d.getFullYear();}
function dateRows(list){return `<div class="dates">${list.map(c=>`<div><i class="${UCLASS[c.urgency]||""}"></i><span><b class="${UCLASS[c.urgency]||""}">${fmt(c.keyDate)}</b> <span class="meta" style="display:inline">${daysLabel(c.keyDate)}</span><br><a href="#" data-act="open-change" data-id="${c.id}">${esc(c.keyLabel)}: ${esc(c.title)}</a></span></div>`).join("")}</div>`;}
function standing(){const app=S.obligations.filter(o=>o.applies==="yes"&&oblInFoot(o)),col={compliant:"var(--green)",partly:"var(--amber)",gap:"var(--red)",unknown:"var(--line-strong)"};
 const n=k=>app.filter(o=>o.status===k).length;
 return `<p style="color:var(--muted);font-size:.92rem;margin-bottom:6px">${app.length} obligations apply to us.</p><div class="statusbar">${Object.keys(CSTATUS).map(k=>n(k)?`<i style="flex:${n(k)} 1 0;background:${col[k]}"></i>`:"").join("")}</div>${Object.keys(CSTATUS).map(k=>`<div class="legend"><span>${CSTATUS[k][0]}</span><b>${n(k)}</b></div>`).join("")}`;}
function leadCard(c,full){if(!c)return `<div class="panel"><h2>This week</h2><p style="color:var(--muted)">Nothing new matches our footprint this week.</p></div>`;
 const others=weekItems().filter(x=>x.id!==c.id).length,isNew=c.status==="new";
 return `<div class="${full?"feature":"panel"}" style="${full?"":"display:flex;flex-direction:column;gap:12px"}"><div class="meta"><span class="pill brass">${full?"Lead":"This week"}</span>${pill(c.urgency)}<span>${esc(c.authority)}${c.published?", "+fmt(c.published):""}</span></div>
 <h2 class="${full?"lead":""}" style="${full?"":"font-size:1.45rem"}">${esc(c.title)}</h2>${full?`<p style="max-width:70ch;margin:0">${esc(c.summary)}</p>`:""}
 <div class="sowhat" style="margin:0">${c.sowhat.confirmed?"":'<span class="ai">Drafted by AI, not yet confirmed by a person</span>'}<b>So what?</b> ${esc(c.sowhat.text)}${c.keyDate?` <b>${esc(c.keyLabel)} ${fmt(c.keyDate)}.</b>`:""}</div>
 <div class="barwrap"><div class="bar">${full?`<button class="btn" data-act="open-change" data-id="${c.id}">${isNew?"Triage this change":"Open this change"}</button>`:`<button class="btn" data-act="nav" data-v="week">Read the briefing</button><button class="btn ghost" data-act="open-change" data-id="${c.id}">${isNew?"Triage":"Open"}</button>`}</div>${!full&&others?`<span class="meta">${others} more item${others>1?"s":""} this week</span>`:""}</div></div>`;}

function vToday(){
 const tri=S.changes.filter(c=>c.status==="new"&&inFoot(c)),sign=S.changes.filter(c=>c.status==="signoff"),mine=S.changes.filter(c=>c.owner===S.user&&!["closed","dismissed","signoff"].includes(c.status)),props=S.proposals.filter(p=>p.status==="open");
 const up=upcomingList().filter(inFoot),rm=roadmapItems().length,first=tri.slice().sort((x,y)=>(x.keyDate||"9").localeCompare(y.keyDate||"9"))[0];
 const ok=S.sources.filter(x=>x[2]==="ok").length,bad=S.sources.filter(x=>x[2]!=="ok");
 const decide=[tri.length?`${tri.length} change${tri.length>1?"s":""} need${tri.length>1?"":"s"} triage.${first&&first.keyDate?" The most urgent takes effect "+daysLabel(first.keyDate)+".":""}`:"Nothing is waiting for triage.",
  sign.length?`${sign.length} waiting for sign-off.`:"",props.length?`${props.length} agent proposal${props.length>1?"s":""} to review.`:"",mine.length?`${mine.length} assigned to you.`:""].filter(Boolean);
 return `<div class="head"><div><p class="kicker">${longDate()}</p><h1>What is coming, and where we stand</h1></div></div>
 <div class="home" style="margin-bottom:16px">
  <div class="feature"><h2>Coming up</h2>${up.length?dateRows(up.slice(0,3)):'<p style="color:var(--muted)">No dated changes ahead.</p>'}
   <div class="barwrap" style="margin-top:auto"><div class="bar"><button class="btn ghost" data-act="nav" data-v="roadmap">Open the roadmap</button></div><span class="meta">${rm} dated item${rm===1?"":"s"} ahead</span></div></div>
  ${leadCard(leadItem(),false)}
 </div>
 <div class="pair"><div class="panel"><h2>Decide now</h2>${decide.map(d=>`<p style="margin-bottom:6px">${esc(d)}</p>`).join("")}<div class="bar"><button class="btn" data-act="watch-tab" data-tab="${tri.length||!props.length?"triage":"proposals"}">Open the queue</button>${sign.length?`<button class="btn ghost" data-act="watch-tab" data-tab="progress">Sign-offs</button>`:""}</div></div>
  <div class="panel"><h2>Where we stand</h2>${standing()}<div class="bar"><button class="btn ghost small" data-act="nav" data-v="reports">See the gaps</button></div></div></div>
 <div class="foot"><span>Sources: ${ok} of ${S.sources.length} checked${bad.length?". "+esc(bad[0][0])+" failed "+esc(bad[0][1])+".":"."}</span><a href="#" data-act="nav" data-v="reports">See coverage log</a></div>`;
}

function vWeek(){
 const w=weekItems(),lead=w[0]||null,rest=w.slice(1),up=upcomingList().filter(inFoot).slice(0,3);
 return `<button class="back" data-act="nav" data-v="today">Back to home</button>
 <div class="head"><div><p class="kicker">${weekLabel()}</p><h1>This week in brief</h1></div><span class="meta">The same items go out in the weekly email.</span></div>
 ${lead?leadCard(lead,true):'<div class="empty">Nothing new matches our footprint this week. Widen the footprint under Settings, or check the Watch tab for older items.</div>'}
 <div class="home" style="grid-template-columns:1.7fr 1fr;margin-top:24px"><div><h2 style="margin-bottom:16px">Also this week</h2>${rest.map(c=>`<div class="brief"><a href="#" data-act="open-change" data-id="${c.id}">${esc(c.title)}</a><p><b style="color:var(--text)">So what?</b> ${esc(c.sowhat.text)}</p>${pill(c.urgency)} ${c.flags.map(f=>`<span class="pill brass">${esc(f)}</span>`).join(" ")} <span class="pill">${esc(STATUS_LABEL[c.status])}</span></div>`).join("")||'<p style="color:var(--muted)">Nothing else this week.</p>'}</div>
 <div class="panel" style="align-self:start"><h2>Coming up</h2>${up.length?dateRows(up):'<p style="color:var(--muted)">No dated changes ahead.</p>'}<div class="bar"><button class="btn ghost small" data-act="nav" data-v="roadmap">Open the roadmap</button></div></div></div>`;
}

function roadmapItems(){
 const out=[];
 for(const c of S.changes){if(["closed","dismissed"].includes(c.status)||!inFoot(c))continue;
  if(c.keyDate&&daysTo(c.keyDate)>=0)out.push({id:"c-"+c.id,date:c.keyDate,kind:"reg",u:c.urgency,cls:UCLASS[c.urgency]||"",short:c.keyLabel+": "+c.title,title:c.title,what:c.summary,sowhat:c.sowhat.text,status:STATUS_LABEL[c.status],owner:uname(c.owner),source:c.source.label,obls:c.obligations,act:"open-change",ref:c.id,label:"Open change"});
  if(c.assessment&&c.assessment.saved&&c.assessment.deadline&&daysTo(c.assessment.deadline)>=0)out.push({id:"d-"+c.id,date:c.assessment.deadline,kind:"ours",u:"Our deadline",cls:"brass",short:"Internal deadline: "+c.title,title:"Internal deadline: "+c.title,what:"Set in the impact assessment. What must change: "+(c.assessment.change||"nothing recorded")+".",sowhat:c.keyDate?"Leaves "+Math.max(0,daysTo(c.keyDate)-daysTo(c.assessment.deadline))+" days of margin before "+c.keyLabel.toLowerCase()+" "+fmt(c.keyDate)+".":"Our own target for being ready.",status:STATUS_LABEL[c.status],owner:uname(c.owner),source:"Impact assessment",obls:c.obligations,act:"open-change",ref:c.id,label:"Open change"});
  for(const x of c.actions){if(!x.done&&x.due&&daysTo(x.due)>=0)out.push({id:"a-"+x.id,date:x.due,kind:"ours",u:"Our deadline",cls:"brass",short:"Action: "+x.title,title:"Action due: "+x.title,what:"An open action under the change: "+c.title+".",sowhat:"Sign-off on the change stays blocked until every action is done.",status:"Open action",owner:uname(x.owner),source:"Change record, action list",obls:c.obligations,act:"open-change",ref:c.id,label:"Open change"});}}
 for(const o of S.obligations){if(o.applies!=="yes"||o.status==="compliant"||!o.review||daysTo(o.review)<0||!oblInFoot(o))continue;
  out.push({id:"o-"+o.id,date:o.review,kind:"ours",u:"Our deadline",cls:"brass",short:"Review: "+o.title,title:"Review due: "+o.title,what:CSTATUS[o.status][0]+". "+(o.statusNote||"No note recorded."),sowhat:o.status==="unknown"?"Assess it and record the compliance status.":"Decide the fix, or document why the current state is acceptable.",status:CSTATUS[o.status][0],owner:uname(o.owner),source:"Inventory, next review date",obls:[o.id],act:"open-obl",ref:o.id,label:"Open obligation"});}
 for(const g of S.gaps){if(!["open","remediating"].includes(g.status))continue;const o=obl(g.obl);if(!o||!oblInFoot(o))continue;
  if(g.target&&daysTo(g.target)>=0)out.push({id:"g-"+g.id,date:g.target,kind:"ours",u:"Our deadline",cls:"brass",short:"Close gap: "+g.title,title:"Gap to close: "+g.title,what:g.desc,sowhat:"Until it is closed or the risk is formally accepted, "+o.title.toLowerCase()+" stays short of compliant.",status:GSTATUS[g.status][0],owner:uname(g.owner),source:"Gap register",obls:[g.obl],act:"open-gap",ref:g.id,label:"Open gap"});
  for(const x of g.actions){if(!x.done&&x.due&&daysTo(x.due)>=0)out.push({id:"ga-"+x.id,date:x.due,kind:"ours",u:"Our deadline",cls:"brass",short:"Action: "+x.title,title:"Action due: "+x.title,what:"An open action under the gap: "+g.title+".",sowhat:"The gap cannot be closed until every action is done.",status:"Open action",owner:uname(x.owner),source:"Gap register, action list",obls:[g.obl],act:"open-gap",ref:g.id,label:"Open gap"});}}
 return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function qLabel(d){return "Q"+(Math.floor((+d.slice(5,7)-1)/3)+1)+" "+d.slice(0,4);}
function rmDetail(it){return `<div class="meta"><span class="pill ${it.cls}">${esc(it.u)}</span><b style="color:var(--text)">${fmt(it.date)}</b><span>${daysLabel(it.date)}</span><span>${it.kind==="reg"?"Regulatory date":"Our deadline"}</span></div>
 <h2 style="font-size:1.45rem;margin:10px 0 14px">${esc(it.title)}</h2>
 <div class="rdetail"><div><p>${esc(it.what)}</p><div class="sowhat" style="margin-bottom:0"><b>So what?</b> ${esc(it.sowhat)}</div></div>
 <dl class="kv" style="grid-template-columns:110px 1fr;align-content:start"><dt>Status</dt><dd><b>${esc(it.status)}</b></dd><dt>Owner</dt><dd><b>${esc(it.owner)}</b></dd><dt>Source</dt><dd>${esc(it.source)}</dd><dt>Obligations</dt><dd>${it.obls.map(id=>{const o=obl(id);return o?`<a href="#" data-act="open-obl" data-id="${o.id}">${esc(o.title)}</a>`:"";}).filter(Boolean).join("<br>")||"None linked yet"}</dd></dl></div>
 <div class="bar"><button class="btn" data-act="${it.act}" data-id="${it.ref}">${it.label}</button><button class="btn ghost" data-act="subscribe">Add to calendar</button></div>`;}
function vRoadmap(){
 const ui=S.ui,all=roadmapItems(),shown=all.filter(i=>ui.rmKind==="all"||i.kind===ui.rmKind);
 const sel=shown.find(i=>i.id===ui.rmPick)||shown[0]||null;
 const qs=[];if(all.length){let y=+today().slice(0,4),q=Math.floor((+today().slice(5,7)-1)/3)+1;const last=qLabel(all[all.length-1].date);for(let n=0;n<8;n++){const l="Q"+q+" "+y;qs.push(l);if(l===last)break;q++;if(q>4){q=1;y++;}}}
 const chips=[["all","Everything"],["reg","Regulatory dates"],["ours","Our deadlines"]];
 return `<button class="back" data-act="nav" data-v="today">Back to home</button>
 <div class="head"><div><h1>Roadmap</h1><p>Every dated change and every deadline of our own, by quarter. Select a card to see the details.</p></div><button class="btn ghost" data-act="subscribe">Subscribe to calendar feed</button></div>
 <div class="filters">${chips.map(([k,l])=>`<button class="chip" data-act="rm-kind" data-k="${k}" aria-pressed="${ui.rmKind===k}">${l}</button>`).join("")}<span class="meta">${shown.length} item${shown.length===1?"":"s"} shown</span></div>
 ${qs.length?`<div class="roster" style="grid-template-columns:repeat(${Math.max(qs.length,4)},minmax(0,1fr))">${qs.map(l=>{const list=shown.filter(i=>qLabel(i.date)===l);return `<div class="q ${list.length?"":"none"}"><div class="qh">${l}<span>${list.length}</span></div>${list.map(i=>`<div><button class="rcard" data-act="rm-pick" data-id="${i.id}" aria-pressed="${sel&&sel.id===i.id}"><b class="${i.cls}">${fmt(i.date)}</b><span>${esc(i.short)}</span><small>${i.kind==="reg"?"Regulatory date":"Our deadline"}</small></button>${sel&&sel.id===i.id?`<div class="inline-detail">${rmDetail(i)}</div>`:""}</div>`).join("")||'<small style="color:var(--muted);padding:8px 2px">Nothing dated</small>'}</div>`;}).join("")}</div>
 ${sel?`<div class="feature below-detail" style="gap:0">${rmDetail(sel)}</div>`:""}`:'<div class="empty">No dated items ahead. Dates appear here when a change has an effective date, an action has a due date, or an obligation with a gap is due for review.</div>'}`;
}

function vWatch(){
 const ui=S.ui,tabs=[["triage","Needs triage"],["progress","In progress"],["closed","Closed"],["dismissed","Dismissed"],["proposals","Agent proposals"]];
 const inTab=c=>({triage:c.status==="new",progress:["assigned","assessing","implementing","signoff"].includes(c.status),closed:c.status==="closed",dismissed:c.status==="dismissed"}[ui.watchTab]);
 let body;
 if(ui.watchTab==="proposals"){
  const ps=S.proposals;
  body=`<p style="color:var(--muted)">The research agents never edit the inventory. They propose, and a person approves with the source in front of them.</p><div class="rows">${ps.map(p=>`<div class="row" style="cursor:default"><div class="meta"><span class="pill blue">${esc(p.kind)}</span><span class="pill ${p.status==="open"?"amber":p.status==="approved"?"green":""}">${p.status==="open"?"Waiting":p.status==="approved"?"Approved":"Rejected"}</span></div><h3>${esc(p.title)}</h3><div class="meta"><span>Source: <a href="${esc(p.source.url)}" target="_blank" rel="noopener">${esc(p.source.label)}</a></span></div>${p.scope?`<p style="margin:8px 0 0;font-size:.9rem"><b>Scope suggested by the agent:</b> ${esc(p.scope)}. You can correct it after approval.</p>`:""}${p.status==="open"?`<div class="bar"><button class="btn small" data-act="prop-approve" data-id="${p.id}">Approve change</button><button class="btn ghost small" data-act="prop-reject" data-id="${p.id}">Reject</button>${p.target?`<button class="btn ghost small" data-act="open-obl" data-id="${p.target}">Open</button>`:""}</div>`:""}</div>`).join("")}</div>`;
 }else{
  let list=S.changes.filter(inTab);
  if(ui.fRegime)list=list.filter(c=>c.regimes.includes(ui.fRegime));
  if(ui.fUrgency)list=list.filter(c=>c.urgency===ui.fUrgency);
  if(ui.fFoot)list=list.filter(inFoot);
  body=`<div class="filters"><select data-bind="fRegime" aria-label="Regime"><option value="">All regimes</option>${REGIMES.map(r=>`<option ${ui.fRegime===r?"selected":""}>${r}</option>`).join("")}</select>
  <select data-bind="fUrgency" aria-label="Urgency"><option value="">Any urgency</option>${URGENCY.map(r=>`<option ${ui.fUrgency===r?"selected":""}>${r}</option>`).join("")}</select>
  <button class="chip" data-act="toggle-foot" aria-pressed="${ui.fFoot}">Matches our footprint</button></div>
  <div class="rows">${list.map(changeRow).join("")||'<div class="empty">Nothing here. Change the filters or check another tab.</div>'}</div>`;
 }
 const c=counts();
 return `<div class="head"><div><p class="kicker">${weekLabel()}</p><h1>Watch</h1><p>Changes found by the research agents, waiting for a person to decide.</p></div></div>
 <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-act="watch-tab" data-tab="${k}" aria-selected="${ui.watchTab===k}">${l}${k==="triage"&&c.triage?" ("+c.triage+")":""}${k==="proposals"&&c.props?" ("+c.props+")":""}</button>`).join("")}</div>${body}`;
}

function vChange(v){
 const c=ch(v.id);if(!c)return"<p>Not found.</p>";
 const owners=USERS.map(u=>`<option value="${u.id}" ${c.owner===u.id?"selected":""}>${esc(u.name)}</option>`).join("");
 let work="";
 if(c.status==="new"){
  work=`<div class="panel"><h2>Triage</h2><p style="color:var(--muted)">Confirm that this is relevant, set urgency and give it an owner. Or dismiss it with a reason, which is kept for audit.</p>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="t-urg">Urgency</label><select id="t-urg">${URGENCY.map(u=>`<option ${c.urgency===u?"selected":""}>${u}</option>`).join("")}</select></div>
  <div class="field"><label for="t-own">Owner</label><select id="t-own"><option value="">Choose owner</option>${owners}</select></div></div>
  <div class="field"><label for="t-reason">Reason, if you dismiss</label><textarea id="t-reason" placeholder="For example: we do not receive third-party research"></textarea></div>
  <div id="t-err" class="err" role="alert"></div>
  <div class="bar"><button class="btn" data-act="triage-confirm" data-id="${c.id}">Confirm and assign</button><button class="btn danger" data-act="triage-dismiss" data-id="${c.id}">Dismiss</button></div></div>`;
 }else if(c.status==="assigned"){
  work=`<div class="panel"><h2>Next step</h2><p>Assigned to ${esc(uname(c.owner))}. An impact assessment records whether this applies, what must change and by when.</p><div class="bar"><button class="btn" data-act="assess-start" data-id="${c.id}">Start assessment</button><button class="btn ghost" data-act="close-noaction" data-id="${c.id}">No action</button></div></div>`;
 }else if(c.status==="assessing"){
  const a=c.assessment;
  work=`<div class="panel"><h2>Impact assessment</h2>
  <div class="field"><label for="a-applies">Does it apply to us?</label><select id="a-applies">${["Yes","Partly","No"].map(x=>`<option ${a.applies===x?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><label for="a-why">Why</label><textarea id="a-why">${esc(a.why)}</textarea></div>
  <div class="field"><label for="a-change">What must change</label><textarea id="a-change" placeholder="Processes, customer journeys, disclosures, data, systems">${esc(a.change)}</textarea></div>
  <div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="a-deadline">Internal deadline</label><input type="date" id="a-deadline" value="${esc(a.deadline)}"></div>

const SYN={fees:["costs","charges"],fee:["costs","charges"],price:["costs","charges"],nudging:["appropriateness","warning"],nudge:["appropriateness","warning"],robo:["automated","suitability"],robot:["automated"],algorithm:["automated"],kyc:["due diligence","aml"],onboarding:["due diligence","knowledge"],outsourcing:["third-party","ict"],cloud:["ict","third-party"],vendor:["third-party","ict"],move:["transfer"],flytt:["transfer"],skatt:["tax"],rådgivning:["advice","suitability"],byte:["switch"],analys:["research"]};
function searchAll(q,asOf){
 const words=q.toLowerCase().split(/[^a-zåäö0-9:]+/).filter(w=>w.length>1);if(!words.length)return[];
 const res=[];
 for(const o of S.obligations){const v=verAt(o,asOf),hay=(o.title+" "+v.en+" "+v.sv+" "+o.tags.join(" ")+" "+inst(o.instrument).name+" "+inst(o.instrument).short+" "+o.service.join(" ")+" "+o.stage+" "+o.duty+" "+o.product+" "+o.channel.join(" ")).toLowerCase();
  let score=0,concept=false;for(const w of words){if(o.title.toLowerCase().includes(w))score+=3;if(hay.includes(w))score+=2;else for(const s of (SYN[w]||[])){if(hay.includes(s)){score+=1;concept=true;}}}
  if(score)res.push({kind:"obligation",o,v,score,concept});}
 for(const c of S.changes){const hay=(c.title+" "+c.summary+" "+c.authority).toLowerCase();let score=0;for(const w of words)if(hay.includes(w))score+=2;if(score)res.push({kind:"change",c,score});}
 return res.sort((a,b)=>b.score-a.score);
}
function hl(t,q){let out=esc(t);q.toLowerCase().split(/[^a-zåäö0-9:]+/).filter(w=>w.length>2).forEach(w=>{out=out.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");});return out;}

 "assess-status-save":el=>{const why=val("as-why");if(!why)return err("as-err","Say what the assessment rests on.");const o=obl(el.dataset.id),eid=el.dataset.ent||"",v=el.dataset.v;o.history.unshift({t:today(),by:S.user,method:val("as-method"),status:v,ent:eid,why});if(eid){scopeOf(o,eid).status=v;rollup(o);}else o.status=v;log("Assessed as "+CSTATUS[v][0]+(eid?" for "+ent(eid).name:""),o.title);closeModal();render();toast(["gap","partly"].includes(v)&&!openGaps(o).length?"Saved. Record the gap so it gets an owner and a date.":"Assessment saved");},
 "interp-edit":el=>{const o=obl(el.dataset.id);modal(`<h2 style="margin-bottom:12px">How we read this rule</h2><p>Keep it to what the text leaves open. A second person approves it before it counts.</p><div class="field"><label for="i-text">Interpretation</label><textarea id="i-text" style="min-height:140px">${esc(o.interp?o.interp.text:"")}</textarea></div><div id="i-err2" class="err" role="alert"></div><div class="bar"><button class="btn ghost" data-act="modal-close">Cancel</button><button class="btn" data-act="interp-save" data-id="${o.id}">Send for approval</button></div>`);},

 "product-obls":el=>{const p=S.org.products.find(x=>x.id===el.dataset.id),list=productObls(p);modal(`<h2 style="margin-bottom:4px">${esc(p.name)}</h2><p class="meta" style="margin-bottom:12px"><span>${esc(ent(p.entity).name)}</span><span>${esc(p.accounts.join(", "))}</span><span>${esc(p.services.join(", "))}</span></p><p>${list.length} obligations meet this product, matched on legal entity, account type and service.</p><div class="rows">${list.map(o=>`<button class="row" data-act="open-obl" data-id="${o.id}"><div class="meta"><span class="pill brass">${esc(inst(o.instrument).short)}</span>${o.applies==="yes"?cpill(o):'<span class="pill amber">Under assessment</span>'}${openGaps(o).length?`<span class="pill red">${openGaps(o).length} open gap${openGaps(o).length===1?"":"s"}</span>`:""}</div><h3 style="margin:6px 0 0;font-size:1rem">${esc(o.title)}</h3></button>`).join("")}</div><div class="bar"><button class="btn ghost" data-act="modal-close">Close</button></div>`);},

 "agent-stop":el=>{if(!isAdmin())return;const a=S.agents.find(x=>x.id===el.dataset.id),r=a.runs.find(x=>x.status==="running");if(!r)return;r.status="stopped";r.cost=0.20;S.budget.spent=Math.round((S.budget.spent+r.cost)*100)/100;log("Stopped a running agent",a.name);render();},
 "budget-save":()=>{if(!isAdmin())return;const n=+val("b-cap");if(!(n>0))return toast("Enter an amount above zero");S.budget.cap=n;log("Set monthly agent cap to "+money(n),"Agents");render();toast("Cap updated");},
 "source-new":()=>modal(`<h2 style="margin-bottom:12px">Request a source</h2><div class="field"><label for="s-name">Name</label><input id="s-name"></div><div class="field"><label for="s-url">Address</label><input id="s-url" placeholder="example.se/news"></div><div class="field"><label for="s-vis">Who is it for</label><select id="s-vis"><option value="Private to us">Only us. Active at once, findings stay private</option><option value="Suggested for everyone">Everyone. A bleqq editor reviews it for the shared library</option></select></div><div id="s-err" class="err" role="alert"></div><div class="bar"><button class="btn ghost" data-act="modal-close">Cancel</button><button class="btn" data-act="source-save">Request source</button></div>`),
 "source-save":()=>{const n=val("s-name"),u=val("s-url");if(!n||!u)return err("s-err","Give the source a name and an address.");const vis=val("s-vis");S.privateSources.push({name:n,url:u,vis,status:vis==="Private to us"?"Active":"Waiting for editor"});log("Requested source: "+n,"Agents");closeModal();render();toast(vis==="Private to us"?"Source added":"Sent to the library editors");}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;if(el.tagName==="INPUT"&&el.type==="checkbox")return;const fn=ACT[el.dataset.act];if(fn)fn(el,e);});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.bind){S.ui[t.dataset.bind]=t.value;render();}
 else if(t.dataset.bindLive){S.ui[t.dataset.bindLive]=t.value;save();renderResults();}
 else if(t.dataset.act==="action-toggle"){const c=ch(t.dataset.id),a=c.actions.find(x=>x.id===t.dataset.aid);a.done=t.checked;log((a.done?"Completed":"Reopened")+" action: "+a.title,c.title);render();}
 else if(t.dataset.actChange==="cstatus"){const o=obl(t.dataset.id),eid=t.dataset.ent||"",v=t.value;render();modal(`<h2 style="margin-bottom:4px">Record the assessment</h2><p class="meta" style="margin-bottom:12px"><span class="pill ${CSTATUS[v][1]}">${CSTATUS[v][0]}</span>${eid?`<span>${esc(ent(eid).name)}</span>`:""}</p><div class="field"><label for="as-method">How was it assessed</label><select id="as-method"><option>Self-assessment</option><option>Second-line review</option><option>Internal audit</option><option>External audit</option></select></div><div class="field"><label for="as-why">What it rests on</label><textarea id="as-why" placeholder="What was checked, and what was found"></textarea></div><div id="as-err" class="err" role="alert"></div><div class="bar"><button class="btn ghost" data-act="modal-close">Cancel</button><button class="btn" data-act="assess-status-save" data-id="${o.id}" data-ent="${eid}" data-v="${v}">Save assessment</button></div>`);}
 else if(t.dataset.act==="gap-action-toggle"){const g=gapOf(t.dataset.id),a=g.actions.find(x=>x.id===t.dataset.aid);a.done=t.checked;log((a.done?"Completed":"Reopened")+" action: "+a.title,g.title);render();}
 else if(t.dataset.actChange==="agent-cadence"){if(!isAdmin())return;const a=S.agents.find(x=>x.id===t.dataset.id);a.cadence=t.value;log("Changed cadence to "+t.value,a.name);render();}
 else if(t.dataset.actChange==="risk"){const o=obl(t.dataset.id);o.risk=t.value;log("Set risk to "+t.value,o.title);render();}
 else if(t.dataset.actChange==="owner"){const o=obl(t.dataset.id);o.owner=t.value;log("Changed owner to "+uname(t.value),o.title);render();toast("Owner changed");}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.ui.q=e.target.value;save();renderResults();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
render();
</script>
</body>
</html>
