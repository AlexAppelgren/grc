# Dependency updates (playbook 2.4, 9): grouped weekly per ecosystem, targeting
# main. Majors that a peer dependency cannot take are ignored BY NAME with the
# reason, never by a blanket "no majors" rule, so the rest of the tree keeps
# moving. Advisories on unchanged lockfiles are caught by the nightly `cve` job
# in ci.yml, not here.
#
# Time: Monday 06:00 Stockholm, so a grouped PR is waiting at the start of the
# week and its CI run never overlaps the 02:30 UTC nightly.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend-python:
        patterns:
          - "*"
    # No ignores: ADR 0025 puts every backend package at its newest release,
    # Django included (D-17 superseded 2026-09-19). django-stubs and
    # django-stubs-ext travel in the same weekly group, so they stay a pair.

  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-npm:
        patterns:
          - "*"
    ignore:
      # TypeScript majors are taken (ADR 0025: 7.0.2 since 2026-09-19); the
      # openapi-typescript peer range is widened by an npm override until it
      # declares 7.x itself.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # @next/eslint-plugin-next must match the installed Next version; it
      # moves with `next`, inside the same group, never ahead of it.
      - dependency-name: "@next/eslint-plugin-next"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 changed the PostCSS integration; the two move together.
      - dependency-name: "@tailwindcss/postcss"
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node major the images and CI run (22): typings for
      # a newer runtime admit APIs that do not exist at run time (ADR 0025).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The base images are pinned by digest in both Dockerfiles; this moves the digest
  # (and the tag) through a reviewed pull request (review 2026-11-11 L-12). Node stays
  # on 22 (ADR 0025, @types/node above), Python on 3.12 (CLAUDE.md section 4).
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(images)"
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
