# Frontend toolchain for CI jobs (playbook 2.3, 9).
#
# Node 22 matches the brief; `npm ci` installs exactly what
# frontend/package-lock.json says, and the npm cache is keyed on that lockfile.
name: Set up the frontend toolchain
description: Node 22 with the npm cache keyed on frontend/package-lock.json, then `npm ci` in frontend/.

inputs:
  node-version:
    description: Node version to install.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: |
        set -euo pipefail
        npm ci
